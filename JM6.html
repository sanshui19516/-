<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>与继母的丝袜与日常 · 欢迎</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;900&family=Syncopate:wght@700&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           与继母的丝袜与日常 · 欢迎页
           配色：紫粉主色 + 暖金辅色
           语言：中/英/日 混搭
           ============================================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --hue-primary: 280;
            --hue-secondary: 40;
            --sat-primary: 40%;
            --sat-secondary: 70%;
            --light-primary: 55%;
            --light-secondary: 55%;
            --color-accent: hsl(var(--hue-primary), var(--sat-primary), var(--light-primary));
            --color-gold: hsl(var(--hue-secondary), var(--sat-secondary), var(--light-secondary));
            
            --petal-color-1: hsla(280, 60%, 70%, 0.25);
            --petal-color-2: hsla(320, 50%, 75%, 0.20);
            --petal-color-3: hsla(270, 40%, 65%, 0.25);
            
            --bg-start: hsl(280, 25%, 4%);
            --bg-end: hsl(280, 15%, 2%);
        }

        #game-root {
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background: var(--bg-start);
            background-image: radial-gradient(circle at center, hsla(280, 30%, 15%, 0.6) 0%, var(--bg-start) 100%);
            padding: 20px 0;
        }

        .canvas-container {
            width: 95vw; height: 53.43vw; max-width: 1200px; max-height: 675px;
            display: grid; grid-template-columns: 45% 42% 13%;
            background-image: url('https://testingcf.jsdelivr.net/gh/sanshui19516/CG@main/%E6%AC%A2%E8%BF%8E%E9%A1%B5%E9%9D%A22.jpg');
            background-size: cover; background-position: center;
            position: relative;
            box-shadow: 0 30px 100px rgba(0, 0, 0, 0.8), inset 0 0 80px rgba(0, 0, 0, 0.9), inset 0 0 140px rgba(0, 0, 0, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px; overflow: hidden;
        }

        .canvas-container::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 40%, rgba(0, 0, 0, 0.85) 100%);
            z-index: 12; pointer-events: none;
        }

        .canvas-dot-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(rgba(255, 255, 255, 0.04) 15%, transparent 16%);
            background-size: 6px 6px; z-index: 2; pointer-events: none;
        }

        .ui-corner-bracket { position: absolute; width: 15px; height: 15px; border: 2px solid rgba(255, 255, 255, 0.15); z-index: 13; pointer-events: none; }
        .top-left { top: 25px; left: 25px; border-right: none; border-bottom: none; }
        .bottom-right { bottom: 25px; right: 25px; border-left: none; border-top: none; }

        .nihility-bg-text {
            position: absolute; width: 200%; top: 45%; left: 0; transform: translateY(-50%);
            font-family: 'Syncopate', sans-serif; font-size: 14rem; font-weight: 700;
            color: hsla(280, 30%, 40%, 0.03); letter-spacing: 30px; white-space: nowrap;
            z-index: 1; pointer-events: none; user-select: none; animation: move-nihility 35s linear infinite;
        }

        #petals-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 11; pointer-events: none; will-change: transform; }

        /* ===== 左栏 ===== */
        .left-panel { padding: 5% 7%; display: flex; flex-direction: column; justify-content: space-between; position: relative; z-index: 5; background: linear-gradient(90deg, rgba(6, 6, 8, 0.98) 0%, hsla(280, 25%, 6%, 0.65) 75%, rgba(0, 0, 0, 0) 100%); }
        .hero-quote-header { font-size: 0.75rem; font-weight: 900; color: #cbd5e1; letter-spacing: 2px; line-height: 1.5; text-transform: uppercase; border-left: 3px solid var(--color-gold); padding-left: 10px; }
        .quote-jp { font-size: 0.65rem; color: #8492a6; display: block; margin-top: 4px; letter-spacing: 1px; }
        
        .main-title-group { position: relative; margin-top: 15px; }
        .main-kanji { font-size: 9.5rem; font-weight: 900; color: #ffffff; line-height: 0.85; letter-spacing: -6px; display: inline-block; text-shadow: 1px 1px 0px var(--color-gold), 2px 2px 0px hsla(40, 60%, 30%, 0.8), 3px 3px 0px hsla(40, 60%, 20%, 0.6), 5px 5px 25px rgba(0, 0, 0, 0.95); }
        .japanese-sub { font-size: 0.95rem; color: #f1f5f9; font-weight: 900; letter-spacing: 6px; margin-bottom: 8px; display: block; text-shadow: 0 0 8px rgba(255, 255, 255, 0.3); }
        .numeric-badge { display: inline-block; background-color: #ffffff; color: #000000; padding: 4px 16px; font-size: 0.8rem; font-weight: bold; letter-spacing: 3px; margin-top: 10px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); border-radius: 2px; }
        
        /* ===== 音乐播放器 ===== */
        .music-player { background: rgba(10, 10, 14, 0.75); border: 1px solid rgba(255, 255, 255, 0.08); padding: 16px; margin-top: 30px; display: flex; flex-direction: column; gap: 12px; backdrop-filter: blur(12px); border-radius: 6px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5); }
        .music-player.is-playing { border-color: rgba(181, 137, 61, 0.4); }
        .player-info { display: flex; justify-content: space-between; align-items: center; }
        .track-title { font-size: 0.7rem; font-weight: 700; color: #ffffff; letter-spacing: 1.5px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 65%; }
        .time-display { font-size: 0.65rem; font-family: monospace; color: #94a3b8; font-weight: bold; }
        .progress-container { width: 100%; height: 4px; background: rgba(255, 255, 255, 0.08); position: relative; cursor: pointer; border-radius: 2px; }
        .progress-bar { height: 100%; width: 100%; background: linear-gradient(90deg, var(--color-gold), #ffffff); position: absolute; top: 0; left: 0; border-radius: 2px; box-shadow: 0 0 8px var(--color-gold); }
        .player-controls { display: flex; justify-content: space-between; align-items: center; }
        .play-btn { background: transparent; border: 1px solid rgba(255, 255, 255, 0.3); color: #ffffff; padding: 6px 20px; font-size: 0.65rem; font-weight: 900; letter-spacing: 2px; cursor: pointer; text-transform: uppercase; border-radius: 20px; transition: all 0.3s; }
        .play-btn:hover { background: #ffffff; color: #060608; transform: scale(1.03); }
        .volume-container { display: flex; align-items: center; gap: 8px; }
        .volume-slider { -webkit-appearance: none; appearance: none; width: 70px; height: 3px; background: rgba(255, 255, 255, 0.12); outline: none; border-radius: 2px; cursor: pointer; }
        .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 8px; height: 8px; background: var(--color-gold); border-radius: 50%; }
        
        .left-footer { display: flex; justify-content: space-between; align-items: flex-end; border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 15px; }
        .game-meta { font-size: 0.65rem; color: #475569; font-weight: bold; letter-spacing: 2px; }
        .tag-pill { background-color: transparent; border: 1px solid rgba(255, 255, 255, 0.4); color: #ffffff; padding: 4px 14px; font-size: 0.6rem; font-weight: bold; letter-spacing: 2px; border-radius: 2px; }

        /* ===== 中栏 ===== */
        .center-panel { position: relative; display: flex; align-items: center; justify-content: center; z-index: 4; }
        .art-window { width: 92%; height: 90%; position: relative; overflow: hidden; border-radius: 4px; background: rgba(10,15,15,0.3); border: 1px solid rgba(255, 255, 255, 0.06); }
        .art-window::after { content: ''; position: absolute; width: 100%; height: 2px; background: linear-gradient(90deg, transparent, hsla(40, 50%, 40%, 0.3), rgba(255,255,255,0.4), hsla(40, 50%, 40%, 0.3), transparent); top: 0; z-index: 2; animation: laser-scan 4s linear infinite; }
        .large-bg-kanji { font-size: 16rem; color: rgba(255, 255, 255, 0.02); position: absolute; top: -20px; left: -20px; font-weight: 900; z-index: 2; user-select: none; }
        .tech-overlay { position: absolute; right: 25px; top: 25%; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; color: rgba(255, 255, 255, 0.3); font-size: 0.55rem; font-family: monospace; z-index: 3; }
        .live-pulse-bar { width: 40px; height: 2px; background-color: var(--color-gold); animation: bar-stretch 1.2s infinite ease-in-out; }

        /* ===== 人物立绘 ===== */
        .character-root {
            position: absolute; width: 140%; height: 115%; bottom: 2%; left: -20%; z-index: 10;
            pointer-events: none; transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            transform: translateY(-35px);
            clip-path: inset(0 0 35px 0);
        }
        .character-img {
            width: 100%; height: 100%; object-fit: contain; object-position: bottom center;
            filter: drop-shadow(0 15px 30px rgba(0, 0, 0, 0.8)) drop-shadow(0 0 60px hsla(280, 40%, 30%, 0.15));
            animation: float-character 6s ease-in-out infinite;
        }

        /* ===== 右栏 ===== */
        .right-panel { background: transparent; padding: 40px 15px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; color: #ffffff; position: relative; z-index: 15; background: linear-gradient(-90deg, rgba(6, 6, 8, 0.4) 0%, transparent 100%); }
        .pill-box { border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 20px; padding: 4px 18px; font-size: 0.65rem; letter-spacing: 2px; font-weight: bold; background: rgba(255,255,255,0.02); }
        .vertical-text-wrap { display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .v-kanji-title { writing-mode: vertical-rl; font-size: 2.2rem; font-weight: 900; letter-spacing: 10px; color: #ffffff; text-shadow: 0 4px 10px rgba(0,0,0,0.6); }
        .v-latin-sub { writing-mode: vertical-rl; font-size: 0.7rem; letter-spacing: 6px; color: rgba(255, 255, 255, 0.5); }
        .diamond { color: var(--color-gold); font-size: 0.7rem; animation: pulse-glow 2s infinite ease-in-out; }
        .panel-footer-stamp { text-align: center; }
        .micro-japanese { font-size: 0.45rem; letter-spacing: 3px; color: rgba(255, 255, 255, 0.3); writing-mode: vertical-rl; transform: rotate(180deg); margin-top: 8px; }

        /* ===== 动画 ===== */
        @keyframes move-nihility { 0% { transform: translate(0, -50%); } 100% { transform: translate(-50%, -50%); } }
        @keyframes float-character { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
        @keyframes laser-scan { 0% { top: 0%; opacity: 0; } 5%, 95% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
        @keyframes bar-stretch { 0%, 100% { width: 15px; } 50% { width: 45px; } }
        @keyframes pulse-glow { 0%, 100% { opacity: 0.3; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.1); } }

        /* ========================================================= */
        /* 🌟 手机端竖屏适配 */
        /* ========================================================= */
        @media (max-width: 600px) {
            #game-root { padding: 0; background: var(--bg-start); min-height: 100vh; }
            .canvas-container {
                width: 100vw; height: 100vh; max-width: 100%; max-height: 100%;
                border-radius: 0; box-shadow: none; aspect-ratio: unset;
                display: flex; flex-direction: column; justify-content: space-between;
                background-image: url('https://testingcf.jsdelivr.net/gh/sanshui19516/CG@main/%E6%AC%A2%E8%BF%8E%E9%A1%B5%E9%9D%A22.jpg');
                background-size: cover; background-position: center 30%;
                padding: 5% 4%;
                position: relative;
            }
            .canvas-container::after {
                background: linear-gradient(to bottom, rgba(6,6,8,0.2) 0%, rgba(6,6,8,0.4) 50%, rgba(6,6,8,0.95) 100%);
                z-index: 2;
            }
            .canvas-dot-overlay, .ui-corner-bracket, .nihility-bg-text, .center-panel, .right-panel .panel-footer-stamp, .right-panel .micro-japanese { display: none; }
            .left-panel { background: transparent; padding: 0; width: 100%; z-index: 5; }
            .music-player { display: none; }
            .tag-pill { display: none; }

            .left-panel .hero-quote-header { font-size: 3.5vw; border-left-width: 2px; padding-left: 8px; margin-bottom: 5px; }
            .left-panel .quote-jp { font-size: 2.5vw; margin-top: 2px; }

            .right-panel {
                position: absolute; top: 5%; right: 4%; width: auto; padding: 0;
                background: transparent; z-index: 5;
            }
            .right-panel .pill-box { font-size: 2.5vw; padding: 2px 8px; margin-bottom: 5px; }
            .right-panel .vertical-text-wrap { gap: 5px; }
            .right-panel .v-kanji-title { font-size: 6vw; letter-spacing: 4px; }
            .right-panel .v-latin-sub { font-size: 2.5vw; letter-spacing: 2px; }
            .right-panel .diamond { font-size: 2.5vw; }

            .left-panel .main-title-group { margin-top: 10px; }
            .left-panel .japanese-sub { font-size: 3vw; letter-spacing: 4px; margin-bottom: 0; }
            .left-panel .main-kanji { font-size: 26vw; text-align: left; line-height: 0.9; letter-spacing: -4px; display: block; }
            .left-panel .numeric-badge { font-size: 2.5vw; padding: 2px 8px; margin-top: 5px; display: inline-block; }
            .left-footer { display: none; }

            .mobile-play-wrapper {
                position: absolute; z-index: 15; bottom: 38vh; left: 50%; transform: translateX(-50%);
                background: hsla(280, 25%, 15%, 0.6);
                backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
                border: 1.5px solid rgba(255, 255, 255, 0.25);
                border-radius: 40px; padding: 14px 40px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(255, 255, 255, 0.05);
                cursor: pointer; transition: transform 0.2s, background 0.2s; text-align: center; white-space: nowrap; pointer-events: auto;
            }
            .mobile-play-wrapper:active { transform: translateX(-50%) scale(0.92); background: rgba(255, 255, 255, 0.15); }
            .mobile-play-wrapper .play-text { color: #fff; font-weight: 900; font-size: 4.5vw; letter-spacing: 6px; text-transform: uppercase; display: block; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
            .mobile-play-wrapper .play-sub { display: block; font-size: 2.2vw; color: rgba(255, 255, 255, 0.5); letter-spacing: 2px; margin-top: 2px; text-shadow: 0 2px 6px rgba(0,0,0,0.8); }
        }
    </style>
</head>
<body>
    <div id="game-root">
        <div class="canvas-container" id="main-canvas">
            <div class="canvas-dot-overlay"></div>
            <div class="ui-corner-bracket top-left"></div>
            <div class="ui-corner-bracket bottom-right"></div>
            <div class="nihility-bg-text">日常 · 丝袜 · 禁忌</div>
            <canvas id="petals-canvas"></canvas>
            
            <!-- ===== 左栏 ===== -->
            <section class="left-panel">
                <div class="hero-quote-header">
                    A gentle touch, a fleeting glance
                    <span class="quote-jp">日常の中の、一瞬の禁忌</span>
                </div>
                <div class="main-title-group">
                    <span class="japanese-sub">BLAZING BRIGHT · ブレイジング・ブライト</span>
                    <h1 class="main-kanji">美咲</h1><br>
                    <div class="numeric-badge">作者：三年的水</div>
                    <div class="music-player" id="player-card">
                        <div class="player-info">
                            <span class="track-title">Jump to Opening</span>
                            <span class="time-display">▶ 1/1</span>
                        </div>
                        <div class="progress-container">
                            <div class="progress-bar" style="width:100%;"></div>
                        </div>
                        <div class="player-controls">
                            <button class="play-btn" id="play-trigger-pc">▶ PLAY</button>
                            <div class="volume-container">
                                <span class="volume-label">—</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="left-footer">
                    <p class="game-meta">OVERDRIVE MODE // FREQUENCY: STABLE</p>
                    <div class="tag-pill">日常 · 暧昧</div>
                </div>
            </section>

            <!-- ===== 中栏 ===== -->
            <section class="center-panel">
                <div class="art-window">
                    <span class="large-bg-kanji">家</span>
                    <div class="tech-overlay">
                        <span>STATUS: ACTIVE</span>
                        <span>GLASS: MURASAKI_DARK</span>
                        <div class="live-pulse-bar"></div>
                    </div>
                </div>
                <div class="character-root" id="character-layer">
                    <img src="https://testingcf.jsdelivr.net/gh/sanshui19516/CG@main/%E6%AC%A2%E8%BF%8E%E9%A1%B5%E9%9D%A2.png" alt="三条美咲" class="character-img">
                </div>
            </section>

            <!-- ===== 右栏 ===== -->
            <aside class="right-panel">
                <div class="pill-box">继母</div>
                <div class="vertical-text-wrap">
                    <span class="v-kanji-title">継母</span>
                    <span class="v-latin-sub">MOTHER</span>
                    <span class="diamond">✦</span>
                    <span class="v-latin-sub">日常</span>
                </div>
                <div class="panel-footer-stamp">
                    <div style="color: rgba(255,255,255,0.2); font-size: 10px;">—</div>
                    <p class="micro-japanese">日常の中の、永遠の一瞬</p>
                </div>
            </aside>

            <!-- ===== 手机端 PLAY 按钮 ===== -->
            <div class="mobile-play-wrapper" id="play-trigger-mobile">
                <span class="play-text">▶ PLAY</span>
                <span class="play-sub">物語を始める</span>
            </div>

        </div>
    </div>

    <!-- ============================================================
    JavaScript：包含跳转逻辑（已修复）+ 视差 + 花瓣动画
    ============================================================ -->
    <script>
        // ============================================================
        // 1. 跳转逻辑（已修复：添加完整的错误提示和反馈）
        // ============================================================
        async function switchOpening(swipeId) {
            console.log('[欢迎页] 点击 PLAY，尝试跳转到索引:', swipeId);
            
            try {
                let messages;
                
                // 第一步：尝试获取聊天消息
                try {
                    messages = await getChatMessages?.('0', { include_swipe: true });
                    console.log('[欢迎页] getChatMessages 返回:', messages);
                } catch (e) {
                    console.warn('[欢迎页] getChatMessages 失败，尝试使用 SillyTavern 上下文:', e);
                    const context = window.SillyTavern?.getContext?.();
                    messages = context?.chat?.messages;
                    console.log('[欢迎页] 从上下文获取消息:', messages);
                }
                
                // 检查是否有消息
                if (!messages || messages.length === 0) {
                    const errorMsg = '没有找到聊天消息，请确认已打开一个聊天。';
                    console.error('[欢迎页] ' + errorMsg);
                    alert('⚠️ ' + errorMsg);
                    throw new Error(errorMsg);
                }
                
                const userMessage = messages[0];
                console.log('[欢迎页] 第一条消息:', userMessage);
                
                // 检查是否有 swipes
                if (!userMessage.swipes) {
                    const errorMsg = '第一条消息没有滑动条（swipes），请确保第一条消息有多个版本。';
                    console.error('[欢迎页] ' + errorMsg);
                    alert('⚠️ ' + errorMsg);
                    throw new Error(errorMsg);
                }
                
                console.log('[欢迎页] 可用滑动条数量:', userMessage.swipes.length);
                
                // 检查目标 swipeId 是否存在
                if (userMessage.swipes.length <= swipeId) {
                    const errorMsg = '滑动条 ' + swipeId + ' 不存在，当前只有 ' + userMessage.swipes.length + ' 个。';
                    console.error('[欢迎页] ' + errorMsg);
                    alert('⚠️ ' + errorMsg);
                    throw new Error(errorMsg);
                }
                
                const targetSwipe = userMessage.swipes[swipeId];
                console.log('[欢迎页] 目标滑动条:', targetSwipe);
                
                // 尝试用 setChatMessage 切换
                const setChatMessage = window.setChatMessage || window.SillyTavern?.getContext?.()?.setChatMessage;
                
                if (typeof setChatMessage === 'function') {
                    await setChatMessage(targetSwipe, 0, { 
                        swipe_id: swipeId, 
                        refresh: 'display_and_render_current' 
                    });
                    console.log('[欢迎页] ✅ 跳转成功（setChatMessage）');
                    alert('✅ 跳转成功！正在切换到目标内容...');
                    return;
                } 
                
                // 尝试用 setSwipe 切换
                if (typeof userMessage.setSwipe === 'function') {
                    userMessage.setSwipe(swipeId);
                    console.log('[欢迎页] ✅ 跳转成功（setSwipe）');
                    alert('✅ 跳转成功！正在切换到目标内容...');
                    return;
                }
                
                // 如果都不可用
                const errorMsg = '无法找到切换消息的方法，请确认当前环境支持。';
                console.error('[欢迎页] ' + errorMsg);
                alert('⚠️ ' + errorMsg + '\n\n请确认已正确导入到 SillyTavern 的局部正则中。');
                throw new Error(errorMsg);
                
            } catch (error) {
                console.error('[欢迎页] 跳转失败:', error);
                // 如果用户还没看到错误提示，这里再兜底一次
                if (!error.message.includes('用户已看到提示')) {
                    alert('❌ 跳转失败：' + error.message + '\n\n请确认：\n1. 已在 SillyTavern 中打开聊天\n2. 第一条消息有多个版本（swipes）\n3. 已正确导入局部正则脚本');
                }
            }
        }

        // ============================================================
        // 2. 按钮点击绑定（已修复：添加反馈）
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('[欢迎页] DOM 加载完成，开始绑定按钮...');
            
            var pcBtn = document.getElementById('play-trigger-pc');
            var mobileBtn = document.getElementById('play-trigger-mobile');
            
            console.log('[欢迎页] PC按钮:', pcBtn);
            console.log('[欢迎页] 手机按钮:', mobileBtn);

            var clickHandler = function() {
                console.log('[欢迎页] PLAY 按钮被点击');
                
                // 按钮动画反馈
                if (pcBtn) {
                    pcBtn.style.opacity = '0.6';
                    pcBtn.style.pointerEvents = 'none';
                    setTimeout(function() {
                        pcBtn.style.opacity = '1';
                        pcBtn.style.pointerEvents = 'auto';
                    }, 500);
                }
                if (mobileBtn) {
                    mobileBtn.style.transform = 'translateX(-50%) scale(0.92)';
                    setTimeout(function() {
                        mobileBtn.style.transform = 'translateX(-50%) scale(1)';
                    }, 200);
                }

                // 执行跳转
                try {
                    switchOpening(1);
                } catch (e) {
                    console.error('[欢迎页] 点击处理函数捕获到错误:', e);
                    alert('❌ 点击处理失败：' + e.message);
                }
            };

            if (pcBtn) {
                pcBtn.addEventListener('click', clickHandler);
                console.log('[欢迎页] PC按钮已绑定');
            } else {
                console.warn('[欢迎页] 未找到 PC 按钮');
            }
            
            if (mobileBtn) {
                mobileBtn.addEventListener('click', clickHandler);
                console.log('[欢迎页] 手机按钮已绑定');
            } else {
                console.warn('[欢迎页] 未找到手机按钮');
            }
        });

        // ============================================================
        // 3. 鼠标视差（必须保留，不可改动）
        // ============================================================
        var mainCanvas = document.getElementById('main-canvas');
        var charLayer = document.getElementById('character-layer');
        var petalCanvas = document.getElementById('petals-canvas');
        var ctx = petalCanvas.getContext('2d');

        var mouseX = 0, mouseY = 0;
        var charX = 0, charY = 0;
        var petalsParamX = 0;

        document.addEventListener('mousemove', function(e) {
            mouseX = (e.clientX - window.innerWidth / 2) / (window.innerWidth / 2);
            mouseY = (e.clientY - window.innerHeight / 2) / (window.innerHeight / 2);
        });

        function updateParallax() {
            var targetX = mouseX * 18;
            var targetY = mouseY * 12;
            charX += (targetX - charX) * 0.08;
            charY += (targetY - charY) * 0.08;
            petalsParamX += (-mouseX * 10 - petalsParamX) * 0.05;
            if (charLayer) {
                charLayer.style.transform = 'translate(' + charX + 'px, ' + charY + 'px)';
            }
            requestAnimationFrame(updateParallax);
        }
        updateParallax();

        // ============================================================
        // 4. Canvas 尺寸（必须保留，不可改动）
        // ============================================================
        function resizeCanvas() {
            if (petalCanvas && mainCanvas) {
                petalCanvas.width = mainCanvas.clientWidth;
                petalCanvas.height = mainCanvas.clientHeight;
            }
        }
        window.addEventListener('resize', resizeCanvas);
        setTimeout(resizeCanvas, 100);

        // ============================================================
        // 5. 花瓣飘落动画（颜色已适配，逻辑必须保留）
        // ============================================================
        var petalsArray = [];
        var maxPetals = 30;
        var petalColors = [
            'rgba(200, 150, 220, 0.25)',
            'rgba(220, 180, 210, 0.20)',
            'rgba(180, 140, 200, 0.25)'
        ];

        function Petal() {
            this.x = Math.random() * (petalCanvas ? petalCanvas.width : 400);
            this.y = Math.random() * -(petalCanvas ? petalCanvas.height : 400);
            this.size = Math.random() * 5 + 3;
            this.speedY = Math.random() * 0.7 + 0.3;
            this.speedX = Math.random() * 0.4 - 0.2;
            this.angle = Math.random() * 360;
            this.spin = Math.random() * 0.8 - 0.4;
            this.color = petalColors[Math.floor(Math.random() * petalColors.length)];
        }

        Petal.prototype.update = function() {
            var w = petalCanvas ? petalCanvas.width : 400;
            var h = petalCanvas ? petalCanvas.height : 400;
            this.y += this.speedY;
            this.x += this.speedX + Math.sin(this.y / 40) * 0.25 + (petalsParamX * 0.02);
            this.angle += this.spin;
            if (this.y > h + 10) {
                this.y = -10;
                this.x = Math.random() * w;
            }
        };

        Petal.prototype.draw = function() {
            if (!ctx) return;
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate((this.angle * Math.PI) / 180);
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.ellipse(0, 0, this.size, this.size / 1.8, 0, 0, 2 * Math.PI);
            ctx.fill();
            ctx.restore();
        };

        // 延迟初始化花瓣，确保 canvas 已准备好
        setTimeout(function() {
            if (petalCanvas) {
                for (var i = 0; i < maxPetals; i++) {
                    var petal = new Petal();
                    petal.x = Math.random() * petalCanvas.width;
                    petal.y = Math.random() * petalCanvas.height;
                    petalsArray.push(petal);
                }
            }
        }, 200);

        function animatePetals() {
            if (!ctx) return;
            ctx.clearRect(0, 0, petalCanvas ? petalCanvas.width : 400, petalCanvas ? petalCanvas.height : 400);
            for (var i = 0; i < petalsArray.length; i++) {
                petalsArray[i].update();
                petalsArray[i].draw();
            }
            requestAnimationFrame(animatePetals);
        }
        animatePetals();

        console.log('[欢迎页] ✅ 所有脚本加载完成');
    </script>
</body>
</html>
