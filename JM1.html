<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>剧情推进 · 与继母的丝袜与日常</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --hue-primary: 270;
    --hue-secondary: 40;
    --sat-primary: 50%;
    --sat-secondary: 80%;
    --light-primary: 60%;
    --light-secondary: 60%;
    --bg-card: hsla(270, 20%, 15%, 0.55);
    --border-glass: hsla(270, 30%, 60%, 0.15);
    --text-primary: hsl(270, 15%, 92%);
    --text-secondary: hsl(270, 10%, 72%);
    --text-dim: hsl(270, 10%, 45%);
    --color-accent: hsl(270, 50%, 60%);
    --color-gold: hsl(40, 80%, 60%);
    --shadow-soft: 0 8px 40px hsla(270, 40%, 10%, 0.6);
    --transition: 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

/* ===== body 完全透明，无额外边距 ===== */
body {
    font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', 'Georgia', serif;
    background: transparent;
    min-height: auto;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 0;
    margin: 0;
    color: var(--text-primary);
    font-weight: 400;
    line-height: 1.6;
}

/* ===== 卡片容器 ===== */
.story-container {
    max-width: 520px;
    width: 100%;
    margin: 0 auto;
    background: var(--bg-card);
    backdrop-filter: blur(24px) saturate(1.3);
    -webkit-backdrop-filter: blur(24px) saturate(1.3);
    border: 1px solid var(--border-glass);
    border-radius: 28px;
    padding: 14px 16px 12px 16px;
    box-shadow: var(--shadow-soft), 0 0 0 1px hsla(270, 30%, 60%, 0.04) inset;
    position: relative;
    overflow: visible;
}

/* ===== 光晕已删除，此处留空 ===== */

.story-container > * { position: relative; z-index: 1; }

/* ===== 导航栏 ===== */
.nav-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 0 8px 0;
    border-bottom: 1px solid var(--border-glass);
    margin-bottom: 8px;
    flex-wrap: wrap;
    gap: 4px;
}
.nav-title {
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 3px;
    background: linear-gradient(135deg, var(--color-accent), var(--color-gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}
.nav-actions {
    display: flex;
    gap: 4px;
    align-items: center;
}
.nav-btn {
    background: hsla(270, 20%, 25%, 0.3);
    border: 1px solid var(--border-glass);
    border-radius: 8px;
    padding: 4px 8px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all var(--transition);
    display: flex;
    align-items: center;
    gap: 3px;
    font-size: 0.55rem;
    font-family: inherit;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
}
.nav-btn:hover {
    background: hsla(270, 30%, 30%, 0.4);
    border-color: hsla(270, 30%, 60%, 0.3);
    color: var(--text-primary);
    transform: translateY(-1px);
}
.nav-btn:active { transform: scale(0.96); }
.nav-btn .icon-svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.nav-btn .badge { font-size: 0.4rem; background: var(--color-accent); color: #0a0a0a; padding: 0 5px; border-radius: 6px; font-weight: 700; }

/* ===== 当前显示 ===== */
.current-display {
    background: hsla(270, 20%, 12%, 0.3);
    border: 1px solid var(--border-glass);
    border-radius: 12px;
    padding: 8px 12px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all var(--transition);
}
.current-display:hover {
    border-color: hsla(270, 30%, 60%, 0.25);
    background: hsla(270, 20%, 18%, 0.3);
    transform: translateY(-2px);
    box-shadow: 0 4px 20px hsla(270, 40%, 10%, 0.2);
}
.current-display.no-plot {
    border-color: hsla(40, 80%, 60%, 0.2);
    background: hsla(40, 80%, 60%, 0.04);
}
.current-display.no-plot .story-title { color: var(--color-gold); font-weight: 700; }
.story-title {
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
}
.story-title .gold { color: var(--color-gold); }
.story-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 10px;
    margin-top: 2px;
    font-size: 0.6rem;
    color: var(--text-secondary);
}
.story-meta .step-status {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 1px 8px;
    border-radius: 8px;
    background: hsla(270, 20%, 20%, 0.3);
    border: 1px solid var(--border-glass);
    font-size: 0.55rem;
}
.story-meta .step-status .dot {
    display: inline-block;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--color-gold);
}
.story-meta .step-status .dot.done { background: hsl(150, 50%, 50%); }
.story-meta .step-status .dot.pending { background: var(--color-gold); animation: pulse-dot 1.8s ease-in-out infinite; }
@keyframes pulse-dot {
    0%, 100% { opacity: 0.4; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.2); }
}
.story-progress-text {
    font-size: 0.55rem;
    color: var(--text-dim);
    letter-spacing: 1px;
}

/* ===== 控制按钮 ===== */
.nav-controls {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
    justify-content: center;
    flex-wrap: wrap;
}
.ctrl-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 5px 12px;
    border: 1px solid var(--border-glass);
    border-radius: 10px;
    background: hsla(270, 20%, 15%, 0.3);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    color: var(--text-secondary);
    font-size: 0.65rem;
    font-family: inherit;
    cursor: pointer;
    transition: all var(--transition);
    flex: 0 1 auto;
    min-width: 60px;
    justify-content: center;
}
.ctrl-btn:hover:not(:disabled) {
    border-color: hsla(270, 30%, 60%, 0.3);
    background: hsla(270, 20%, 25%, 0.3);
    color: var(--text-primary);
    transform: translateY(-2px);
    box-shadow: 0 4px 16px hsla(270, 40%, 10%, 0.2);
}
.ctrl-btn:active:not(:disabled) { transform: scale(0.96); }
.ctrl-btn:disabled { opacity: 0.25; cursor: not-allowed; transform: none; }
.ctrl-btn .icon-svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.ctrl-btn.primary {
    border-color: var(--color-accent);
    color: var(--color-accent);
}
.ctrl-btn.primary:hover:not(:disabled) {
    background: hsla(270, 50%, 60%, 0.12);
    border-color: var(--color-accent);
    box-shadow: 0 0 30px hsla(270, 50%, 60%, 0.06);
}
.ctrl-btn.gold {
    border-color: var(--color-gold);
    color: var(--color-gold);
}
.ctrl-btn.gold:hover:not(:disabled) {
    background: hsla(40, 80%, 60%, 0.10);
    border-color: var(--color-gold);
    box-shadow: 0 0 30px hsla(40, 80%, 60%, 0.06);
}

/* ===== 步骤列表（可折叠） ===== */
.steps-section {
    margin-bottom: 8px;
}
.steps-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 2px 4px 2px;
    border-bottom: 1px solid var(--border-glass);
    margin-bottom: 4px;
}
.steps-header-left {
    display: flex;
    align-items: center;
    gap: 6px;
}
.steps-header h3 {
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 2px;
    color: var(--text-secondary);
    text-transform: uppercase;
}
.steps-header .steps-count {
    font-size: 0.55rem;
    color: var(--text-dim);
}
.steps-list-wrap {
    max-height: 0;
    opacity: 0;
    transition: max-height 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 0.3s ease;
}
.steps-list-wrap.open {
    max-height: 6000px;
    opacity: 1;
}
.step-item {
    background: hsla(270, 20%, 12%, 0.25);
    border: 1px solid var(--border-glass);
    border-radius: 10px;
    padding: 8px 10px;
    margin-bottom: 4px;
    transition: all var(--transition);
    cursor: pointer;
}
.step-item:hover {
    border-color: hsla(270, 30%, 60%, 0.2);
    background: hsla(270, 20%, 18%, 0.2);
}
.step-item.executed {
    border-color: hsla(150, 40%, 40%, 0.2);
    opacity: 0.6;
}
.step-item.executed .step-id {
    background: hsla(150, 40%, 40%, 0.15);
    color: hsl(150, 40%, 55%);
}
.step-item.current {
    border-color: var(--color-accent);
    background: hsla(270, 50%, 60%, 0.04);
    box-shadow: 0 0 30px hsla(270, 50%, 60%, 0.03);
}
.step-item.current .step-id {
    background: hsla(270, 50%, 60%, 0.15);
    color: var(--color-accent);
}
.step-header-line {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
}
.step-id {
    font-size: 0.5rem;
    font-weight: 700;
    padding: 1px 8px;
    border-radius: 6px;
    background: hsla(270, 20%, 20%, 0.3);
    color: var(--text-secondary);
    letter-spacing: 0.5px;
    flex-shrink: 0;
}
.step-location {
    font-size: 0.5rem;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 3px;
}
.step-location .icon-svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.step-event-preview {
    font-size: 0.65rem;
    color: var(--text-secondary);
    margin-top: 2px;
    padding-left: 2px;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
.step-execute-btn {
    margin-left: auto;
    padding: 2px 12px;
    border: 1px solid var(--color-accent);
    border-radius: 6px;
    background: transparent;
    color: var(--color-accent);
    font-size: 0.55rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all var(--transition);
    letter-spacing: 0.5px;
    flex-shrink: 0;
}
.step-execute-btn:hover {
    background: hsla(270, 50%, 60%, 0.12);
    box-shadow: 0 0 20px hsla(270, 50%, 60%, 0.06);
}
.step-execute-btn:active { transform: scale(0.94); }
.step-execute-btn.done {
    border-color: hsl(150, 40%, 40%);
    color: hsl(150, 40%, 55%);
}
.step-execute-btn.done:hover {
    background: hsla(150, 40%, 40%, 0.08);
}

/* ===== 详情面板 ===== */
.detail-panel {
    background: hsla(270, 20%, 10%, 0.4);
    border: 1px solid var(--border-glass);
    border-radius: 12px;
    padding: 12px;
    margin-top: 6px;
    display: none;
}
.detail-panel.open { display: block; }
.detail-panel .detail-close {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 0.8rem;
    cursor: pointer;
    float: right;
}
.detail-panel .detail-close:hover { color: var(--text-primary); }
.detail-panel .detail-characters {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin: 4px 0 8px 0;
}
.detail-panel .char-item {
    display: flex;
    flex-wrap: wrap;
    gap: 2px 8px;
    font-size: 0.6rem;
    color: var(--text-secondary);
    padding: 3px 6px;
    background: hsla(270, 20%, 15%, 0.2);
    border-radius: 6px;
    border-left: 2px solid var(--color-accent);
}
.detail-panel .char-item .name { font-weight: 600; color: var(--text-primary); }
.detail-panel .char-item .mood { color: var(--color-gold); }
.detail-panel .char-item .thoughts { color: var(--text-dim); font-style: italic; font-size: 0.55rem; }
.detail-panel .detail-event {
    font-size: 0.7rem;
    line-height: 1.6;
    color: var(--text-primary);
    padding: 6px 0;
    border-top: 1px solid var(--border-glass);
    margin-top: 4px;
}
.detail-panel .detail-dev {
    font-size: 0.65rem;
    color: var(--text-secondary);
    padding: 6px 0;
    border-top: 1px solid var(--border-glass);
    margin-top: 4px;
    font-style: italic;
}

/* ===== 空状态 ===== */
.empty-state {
    text-align: center;
    padding: 20px 10px;
    color: var(--text-dim);
}
.empty-state .icon-svg {
    width: 30px;
    height: 30px;
    stroke: var(--text-dim);
    fill: none;
    stroke-width: 1.5;
    opacity: 0.2;
    margin-bottom: 6px;
}
.empty-state p { font-size: 0.65rem; letter-spacing: 1px; }
.empty-state .gold { color: var(--color-gold); }

/* ===== 剧情列表（弹窗） ===== */
.story-list-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 9999;
    background: hsla(260, 20%, 6%, 0.6);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    justify-content: center;
    align-items: center;
    padding: 20px;
}
.story-list-overlay.open { display: flex; }
.story-list-panel {
    background: var(--bg-card);
    backdrop-filter: blur(24px) saturate(1.3);
    -webkit-backdrop-filter: blur(24px) saturate(1.3);
    border: 1px solid var(--border-glass);
    border-radius: 20px;
    max-width: 440px;
    width: 100%;
    max-height: 80vh;
    padding: 16px 16px;
    box-shadow: var(--shadow-soft);
    overflow: hidden;
    display: flex;
    flex-direction: column;
}
.story-list-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border-glass);
    flex-shrink: 0;
}
.story-list-header h2 {
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 2px;
    color: var(--text-primary);
}
.story-list-header .close-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 1.1rem;
    cursor: pointer;
}
.story-list-header .close-btn:hover { color: var(--text-primary); }
.story-list-body {
    overflow-y: auto;
    padding-top: 10px;
    flex: 1;
}
.story-list-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 10px;
    border-radius: 8px;
    margin-bottom: 3px;
    cursor: pointer;
    transition: all var(--transition);
    border: 1px solid transparent;
}
.story-list-item:hover {
    background: hsla(270, 20%, 18%, 0.3);
    border-color: var(--border-glass);
}
.story-list-item.current {
    border-color: var(--color-accent);
    background: hsla(270, 50%, 60%, 0.04);
}
.story-list-item .title {
    font-size: 0.65rem;
    color: var(--text-secondary);
}
.story-list-item .title .current-mark {
    color: var(--color-accent);
    font-size: 0.5rem;
    margin-right: 4px;
}
.story-list-item .progress {
    font-size: 0.5rem;
    color: var(--text-dim);
    white-space: nowrap;
}
.story-list-item .progress .done { color: hsl(150, 50%, 50%); }
.story-list-item .progress .pending { color: var(--color-gold); }

/* ===== 响应式 ===== */
@media (max-width: 480px) {
    body { padding: 0; }
    .story-container { padding: 10px 12px 8px 12px; border-radius: 20px; }
    .story-title { font-size: 0.8rem; }
    .nav-title { font-size: 0.7rem; letter-spacing: 2px; }
    .ctrl-btn { padding: 4px 8px; font-size: 0.55rem; min-width: 44px; }
    .ctrl-btn .icon-svg { width: 12px; height: 12px; }
    .step-item { padding: 6px 8px; }
    .step-event-preview { font-size: 0.6rem; }
    .detail-panel { padding: 10px; }
}
</style>
</head>
<body>
<div class="story-container" id="storyContainer">
    <div class="nav-bar">
        <span class="nav-title">✦ 剧情推进</span>
        <div class="nav-actions">
            <button class="nav-btn" id="collapseToggleBtn" title="折叠/展开步骤列表">
                <svg class="icon-svg" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
                <span id="collapseLabel">折叠</span>
            </button>
            <button class="nav-btn" id="listToggleBtn" title="剧情列表">
                <svg class="icon-svg" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="3" rx="1"/><rect x="4" y="10.5" width="16" height="3" rx="1"/><rect x="4" y="16" width="16" height="3" rx="1"/></svg>
                <span>列表</span>
                <span class="badge" id="totalBadge">0</span>
            </button>
            <button class="nav-btn" id="settingsBtn" title="设置">
                <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v4m0 14v4m11-11h-4m-14 0H1m16.5-4.5l-2.8 2.8m-5.4 5.4l-2.8 2.8m0-11.4l2.8 2.8m5.4 5.4l2.8 2.8"/></svg>
            </button>
        </div>
    </div>

    <div class="current-display no-plot" id="currentDisplay">
        <div class="story-title" id="storyTitleDisplay">
            <span id="titleIcon">✦</span>
            <span id="storyTitleText">未开始剧情</span>
        </div>
        <div class="story-meta">
            <span class="step-status" id="stepStatus">
                <span class="dot pending"></span>
                <span id="stepStatusText">等待开始</span>
            </span>
            <span class="story-progress-text" id="progressText">0 / 0 步</span>
        </div>
    </div>

    <div class="nav-controls">
        <button class="ctrl-btn" id="prevBtn" disabled>
            <svg class="icon-svg" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
            上步
        </button>
        <button class="ctrl-btn primary" id="currentBtn">
            <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/></svg>
            当前
        </button>
        <button class="ctrl-btn gold" id="nextBtn" disabled>
            下步
            <svg class="icon-svg" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
    </div>

    <div class="steps-section" id="stepsSection">
        <div class="steps-header">
            <div class="steps-header-left">
                <h3>📋 步骤</h3>
                <span class="steps-count" id="stepsCount">0 步</span>
            </div>
        </div>
        <div class="steps-list-wrap open" id="stepsListWrap">
            <div id="stepsList">
                <div class="empty-state">
                    <svg class="icon-svg" viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M8 8h8v8H8z"/><path d="M16 8l-4 4-4-4"/><path d="M12 12v6"/></svg>
                    <p>加载中...</p>
                </div>
            </div>
        </div>
    </div>

    <div class="detail-panel" id="detailPanel">
        <button class="detail-close" id="detailClose">✕</button>
        <div id="detailContent">
            <div class="detail-characters" id="detailChars"></div>
            <div class="detail-event" id="detailEvent"></div>
            <div class="detail-dev" id="detailDev"></div>
        </div>
    </div>
</div>

<div class="story-list-overlay" id="storyListOverlay">
    <div class="story-list-panel">
        <div class="story-list-header">
            <h2>✦ 剧情列表</h2>
            <button class="close-btn" id="storyListCloseBtn">✕</button>
        </div>
        <div class="story-list-body" id="storyListBody">
            <div class="empty-state"><p>加载中...</p></div>
        </div>
    </div>
</div>

<script>

    var $ = function(s) { return document.querySelector(s); };

    var storyTitleText = $('#storyTitleText');
    var currentDisplay = $('#currentDisplay');
    var stepStatus = $('#stepStatus');
    var stepStatusText = $('#stepStatusText');
    var progressText = $('#progressText');
    var stepsList = $('#stepsList');
    var stepsCount = $('#stepsCount');
    var totalBadge = $('#totalBadge');
    var prevBtn = $('#prevBtn');
    var nextBtn = $('#nextBtn');
    var currentBtn = $('#currentBtn');
    var detailPanel = $('#detailPanel');
    var detailClose = $('#detailClose');
    var detailChars = $('#detailChars');
    var detailEvent = $('#detailEvent');
    var detailDev = $('#detailDev');
    var stepsListWrap = $('#stepsListWrap');
    var collapseToggleBtn = $('#collapseToggleBtn');
    var collapseLabel = $('#collapseLabel');
    var listToggleBtn = $('#listToggleBtn');
    var storyListOverlay = $('#storyListOverlay');
    var storyListBody = $('#storyListBody');
    var storyListCloseBtn = $('#storyListCloseBtn');

    var plotData = null, storyList = [], currentStoryIndex = 0, currentPlotId = 1, currentStepId = 1, isDetailOpen = false;

    var STORAGE_KEY = 'story_assistant_steps_collapsed';
    var isStepsCollapsed = false;

    function loadCollapsedState() {
        try { var saved = localStorage.getItem(STORAGE_KEY); if (saved !== null) { isStepsCollapsed = saved === 'true'; } else { isStepsCollapsed = false; } } catch (e) { isStepsCollapsed = false; }
        applyCollapsedState();
    }

    function saveCollapsedState() {
        try { localStorage.setItem(STORAGE_KEY, String(isStepsCollapsed)); } catch (e) {} }

    function applyCollapsedState() {
        if (isStepsCollapsed) {
            stepsListWrap.classList.remove('open');
            collapseLabel.textContent = '展开';
        } else {
            stepsListWrap.classList.add('open');
            collapseLabel.textContent = '折叠';
        }
    }

    function toggleCollapsed() {
        isStepsCollapsed = !isStepsCollapsed;
        saveCollapsedState();
        applyCollapsedState();
    }

    function loadPlotData() {
        if (DATA && typeof DATA === 'object' && DATA.plotList) {
            plotData = DATA; console.log('[剧情推进] ✅ 从内联数据加载成功');
            initFromPlotData(); return;
        }
        console.warn('[剧情推进] ⚠️ 未找到剧情数据');
        renderEmptyState();
    }

    function initFromPlotData() {
        if (!plotData || !plotData.plotList || plotData.plotList.length === 0) { renderEmptyState(); return; }
        storyList = plotData.plotList.map(function(plot, idx) {
            var plotId = idx + 1;
            var currentStep = plot.steps.find(function(s) { return s.isExecuted; }) || plot.steps[0] || { stepId: 1 };
            return { id: plotId, title: plot.title, summary: plot.summary || '', steps: plot.steps || [], currentStepId: currentStep.stepId || 1, isExecuted: plot.steps.some(function(s) { return s.isExecuted; }) };
        });
        if (plotData.currentPlot) {
            var targetId = plotData.currentPlot.plotId || 1;
            var found = storyList.findIndex(function(s) { return s.id === targetId; });
            if (found !== -1) { currentStoryIndex = found; currentPlotId = targetId; currentStepId = plotData.currentPlot.stepId || 1; } else { currentStoryIndex = 0; currentPlotId = storyList[0] ? storyList[0].id : 1; currentStepId = storyList[0] && storyList[0].steps[0] ? storyList[0].steps[0].stepId : 1; }
        } else {
            currentStoryIndex = 0; currentPlotId = storyList[0] ? storyList[0].id : 1; currentStepId = storyList[0] && storyList[0].steps[0] ? storyList[0].steps[0].stepId : 1;
        }
        totalBadge.textContent = storyList.length;
        renderAll();
        renderStoryList();
    }

    function getNextPendingStep(story) {
        if (!story || !story.steps) return null;
        return story.steps.find(function(s) { return !s.isExecuted; });
    }

    function renderAll() {
        if (!storyList || storyList.length === 0) { renderEmptyState(); return; }
        var story = storyList[currentStoryIndex];
        if (!story) { renderEmptyState(); return; }
        currentDisplay.classList.remove('no-plot');
        storyTitleText.textContent = story.title;
        var totalSteps = story.steps.length;
        var executedSteps = story.steps.filter(function(s) { return s.isExecuted; }).length;
        var currentStep = story.steps.find(function(s) { return s.stepId == currentStepId; }) || story.steps[0];
        var isCurrentExecuted = currentStep ? (currentStep.isExecuted || false) : false;
        stepStatus.className = 'step-status';
        var dot = stepStatus.querySelector('.dot');
        if (dot) { dot.className = 'dot' + (isCurrentExecuted ? ' done' : ' pending'); }
        stepStatusText.textContent = isCurrentExecuted ? '已执行' : '待执行';
        progressText.textContent = executedSteps + ' / ' + totalSteps + ' 步';
        renderSteps(story);
        updateNavButtons(story);
        currentBtn.textContent = '🎯 ' + currentStepId;
        if (isDetailOpen && currentStep) { renderDetail(currentStep); }
        renderStoryList();
    }

    function renderSteps(story) {
        if (!story || !story.steps || story.steps.length === 0) {
            stepsList.innerHTML = '<div class="empty-state"><p>此剧情暂无步骤</p></div>';
            stepsCount.textContent = '0 步'; return;
        }
        stepsCount.textContent = story.steps.length + ' 步';
        var html = '';
        story.steps.forEach(function(step) {
            var isCurrent = step.stepId == currentStepId;
            var isExecuted = step.isExecuted || false;
            var cls = (isExecuted ? 'executed ' : '') + (isCurrent ? 'current' : '');
            var charsStr = (step.characters || []).map(function(c) { return c.name; }).filter(Boolean).join('、') || '未指定';
            html += '<div class="step-item ' + cls + '" data-step-id="' + step.stepId + '">' +
                '<div class="step-header-line">' +
                '<span class="step-id">步骤 ' + step.stepId + '</span>' +
                '<span class="step-location"><svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 2a8 8 0 0 0-8 8c0 6 8 12 8 12s8-6 8-12a8 8 0 0 0-8-8z"/><circle cx="12" cy="10" r="3"/></svg>' + (step.location || '未指定') + '</span>' +
                '<button class="step-execute-btn ' + (isExecuted ? 'done' : '') + '" data-step-id="' + step.stepId + '">' + (isExecuted ? '✓ 已执行' : '▶ 执行') + '</button>' +
                '</div>' +
                '<div class="step-event-preview">' + (step.event || '').substring(0, 60) + ((step.event || '').length > 60 ? '...' : '') + '</div>' +
                '<div style="font-size:0.5rem;color:var(--text-dim);margin-top:2px;">👥 ' + charsStr + '</div>' +
                '</div>';
        });
        stepsList.innerHTML = html;
        stepsList.querySelectorAll('.step-item').forEach(function(el) {
            el.addEventListener('click', function(e) {
                if (e.target.closest('.step-execute-btn')) return;
                var stepId = parseInt(this.dataset.stepId);
                var step = story.steps.find(function(s) { return s.stepId == stepId; });
                if (step) { currentStepId = stepId; renderAll(); openDetail(step); }
            });
        });
        stepsList.querySelectorAll('.step-execute-btn').forEach(function(btn) {
            btn.addEventListener('click', function(e) { e.stopPropagation(); var stepId = parseInt(this.dataset.stepId); executeStep(stepId); });
        });
    }

    function updateNavButtons(story) {
        var totalSteps = story.steps.length;
        var currentIdx = story.steps.findIndex(function(s) { return s.stepId == currentStepId; });
        var hasPrev = currentIdx > 0 || currentStoryIndex > 0;
        prevBtn.disabled = !hasPrev;
        var hasNextStep = currentIdx < totalSteps - 1;
        var hasNextStory = currentStoryIndex < storyList.length - 1;
        nextBtn.disabled = !(hasNextStep || hasNextStory);
    }

    function executeStep(stepId) {
        var story = storyList[currentStoryIndex];
        if (!story) return;
        var step = story.steps.find(function(s) { return s.stepId == stepId; });
        if (!step) return;
        step.isExecuted = true;
        currentStepId = stepId;
        currentPlotId = story.id;

        var stepData = {
            location: step.location || '未指定',
            characters: step.characters || [],
            event: step.event || '',
            development: step.development || ''
        };
        var textToSend = 'step_data = ' + JSON.stringify(stepData, null, 2);
        if (typeof triggerSlash === 'function') {
            triggerSlash('/send ' + textToSend + '|/trigger');
        } else if (typeof window.triggerSlash === 'function') {
            window.triggerSlash('/send ' + textToSend + '|/trigger');
        } else {
            console.log('[剧情推进] 发送:', textToSend);
            navigator.clipboard ? navigator.clipboard.writeText(textToSend).catch(function() {}) : null;
            alert('请将以下内容粘贴到酒馆对话框：\n\n' + textToSend);
        }
        saveStateToWorldbook();

        var nextPending = getNextPendingStep(story);
        if (nextPending) {
            currentStepId = nextPending.stepId;
        } else if (currentStoryIndex < storyList.length - 1) {
            currentStoryIndex++;
            var nextStory = storyList[currentStoryIndex];
            currentPlotId = nextStory.id;
            var firstStep = nextStory.steps[0];
            if (firstStep) { currentStepId = firstStep.stepId; }
        }

        renderAll();

        var updatedStep = story.steps.find(function(s) { return s.stepId == currentStepId; });
        if (updatedStep) { openDetail(updatedStep); }
        closeStoryList();
    }

    function saveStateToWorldbook() {
        try {
            if (typeof getWorldbook !== 'function' || typeof replaceWorldbook !== 'function') return;
            var charWorldbooks = getCharWorldbookNames('current');
            if (!charWorldbooks || !charWorldbooks.primary) return;
            var entries = getWorldbook(charWorldbooks.primary);
            if (!entries) return;
            var entryList = Array.isArray(entries) ? entries : Object.values(entries);
            var target = entryList.find(function(e) { return e.name && e.name.includes('剧情元数据-与继母的丝袜与日常'); });
            if (!target) return;
            if (!plotData) return;
            plotData.currentPlot = { plotId: currentPlotId, stepId: currentStepId, title: '剧情元数据-与继母的丝袜与日常' };
            plotData.plotList.forEach(function(plot, idx) {
                var story = storyList[idx];
                if (story) {
                    plot.steps.forEach(function(s, si) {
                        var localStep = story.steps[si];
                        if (localStep) { s.isExecuted = localStep.isExecuted || false; }
                    });
                }
            });
            var jsonStr = JSON.stringify(plotData, null, 2);
            target.content = '[plotResultStart]\n' + jsonStr + '\n[plotResultEnd]';
            replaceWorldbook(charWorldbooks.primary, entries);
            console.log('[剧情推进] ✅ 状态已保存到世界书');
        } catch (e) { console.warn('[剧情推进] 保存状态失败:', e); }
    }

    function renderDetail(step) {
        if (!step) { detailChars.innerHTML = ''; detailEvent.textContent = ''; detailDev.textContent = ''; return; }
        var charsHtml = '';
        if (step.characters && step.characters.length > 0) {
            step.characters.forEach(function(c) {
                charsHtml += '<div class="char-item"><span class="name">' + (c.name || '未命名') + '</span><span class="mood">' + (c.mood || '') + '</span><span class="thoughts">' + (c.innerThoughts ? '「' + c.innerThoughts + '」' : '') + '</span></div>';
            });
        } else {
            charsHtml = '<div style="color:var(--text-dim);font-size:0.6rem;">未指定角色</div>';
        }
        detailChars.innerHTML = charsHtml;
        detailEvent.textContent = step.event || '未指定事件';
        detailDev.textContent = step.development ? '→ ' + step.development : '';
    }

    function openDetail(step) {
        isDetailOpen = true;
        detailPanel.classList.add('open');
        renderDetail(step);
        setTimeout(function() { detailPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 100);
    }

    function closeDetail() { isDetailOpen = false; detailPanel.classList.remove('open'); }

    function renderEmptyState() {

        nextBtn.disabled = true;
        currentBtn.textContent = '🎯 —';
        storyListBody.innerHTML = '<div class="empty-state"><p>暂无剧情</p></div>';
    }

    function renderStoryList() {
        if (!storyList || storyList.length === 0) {
            storyListBody.innerHTML = '<div class="empty-state"><p>暂无剧情</p></div>';
            return;
        }
        var html = '';
        storyList.forEach(function(story, idx) {
            var total = story.steps.length;
            var done = story.steps.filter(function(s) { return s.isExecuted; }).length;
            var isCurrent = idx === currentStoryIndex;
            var progressText = done + '/' + total;
            html += '<div class="story-list-item' + (isCurrent ? ' current' : '') + '" data-index="' + idx + '">' +
                '<span class="title">' + (isCurrent ? '<span class="current-mark">▶</span>' : '') + story.title + '</span>' +
                '<span class="progress"><span class="' + (done === total ? 'done' : 'pending') + '">' + progressText + '</span></span>' +
                '</div>';
        });
        storyListBody.innerHTML = html;
        storyListBody.querySelectorAll('.story-list-item').forEach(function(el) {
            el.addEventListener('click', function() {
                var index = parseInt(this.dataset.index);
                if (!isNaN(index) && index >= 0 && index < storyList.length) {
                    currentStoryIndex = index;
                    currentPlotId = storyList[index].id;
                    var firstStep = storyList[index].steps[0];
                    if (firstStep) { currentStepId = firstStep.stepId; }
                    renderAll();
                    closeStoryList();
                }
            });
        });
    }

    function openStoryList() {
        storyListOverlay.classList.add('open');
        document.body.style.overflow = 'hidden';
        renderStoryList();
    }

    function closeStoryList() {
        storyListOverlay.classList.remove('open');
        document.body.style.overflow = '';
    }

    function bindEvents() {
        collapseToggleBtn.addEventListener('click', function(e) { e.stopPropagation(); toggleCollapsed(); });

        prevBtn.addEventListener('click', function() {
            var story = storyList[currentStoryIndex];
            if (!story) return;
            var currentIdx = story.steps.findIndex(function(s) { return s.stepId == currentStepId; });
            if (currentIdx > 0) {
                currentStepId = story.steps[currentIdx - 1].stepId;
                renderAll();
                openDetail(story.steps[currentIdx - 1]);
            } else if (currentStoryIndex > 0) {
                currentStoryIndex--;
                var prevStory = storyList[currentStoryIndex];
                currentPlotId = prevStory.id;
                var lastStep = prevStory.steps[prevStory.steps.length - 1];
                currentStepId = lastStep.stepId;
                renderAll();
                openDetail(lastStep);
            }
        });

        nextBtn.addEventListener('click', function() {
            var story = storyList[currentStoryIndex];
            if (!story) return;
            var currentIdx = story.steps.findIndex(function(s) { return s.stepId == currentStepId; });
            if (currentIdx < story.steps.length - 1) {
                var nextStep = story.steps[currentIdx + 1];
                currentStepId = nextStep.stepId;
                renderAll();
                openDetail(nextStep);
            } else if (currentStoryIndex < storyList.length - 1) {
                currentStoryIndex++;
                var nextStory = storyList[currentStoryIndex];
                currentPlotId = nextStory.id;
                var firstStep = nextStory.steps[0];
                currentStepId = firstStep.stepId;
                renderAll();
                openDetail(firstStep);
            }
        });

        currentBtn.addEventListener('click', function() {
            var story = storyList[currentStoryIndex];
            if (!story) return;
            var currentStep = story.steps.find(function(s) { return s.stepId == currentStepId; }) || story.steps[0];
            if (currentStep) { openDetail(currentStep); }
        });

        detailClose.addEventListener('click', closeDetail);
        document.addEventListener('click', function(e) {
            if (isDetailOpen && !detailPanel.contains(e.target) && !e.target.closest('.step-item') && !e.target.closest('#currentBtn')) {
                closeDetail();
            }
        });

        listToggleBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (storyListOverlay.classList.contains('open')) {
                closeStoryList();
            } else {
                openStoryList();
            }
        });

        storyListOverlay.addEventListener('click', function(e) {
            if (e.target === storyListOverlay) { closeStoryList(); }
        });
        storyListCloseBtn.addEventListener('click', closeStoryList);

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                if (storyListOverlay.classList.contains('open')) { closeStoryList(); }
                if (isDetailOpen) { closeDetail(); }
            }
        });
    }

    function bindKeyboard() {
        document.addEventListener('keydown', function(e) {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.key === 'ArrowLeft' || e.key === 'a') { e.preventDefault(); prevBtn.click(); }
            else if (e.key === 'ArrowRight' || e.key === 'd') { e.preventDefault(); nextBtn.click(); }
            else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); currentBtn.click(); }
            else if (e.key === 'Escape') { if (!storyListOverlay.classList.contains('open')) closeDetail(); }
        });
    }

    function init() {
        loadCollapsedState();
        bindEvents();
        bindKeyboard();
        loadPlotData();
        console.log('[剧情推进] ✅ 初始化完成');
    }

    if (document.readyState === 'complete' || document.readyState === 'interactive') {
        init();
    } else {
        document.addEventListener('DOMContentLoaded', init);
    }

    window.__storyAssistant = {
        reload: loadPlotData,
        goTo: function(plotId, stepId) {
            var storyIdx = storyList.findIndex(function(s) { return s.id === plotId; });
            if (storyIdx === -1) return;
            currentStoryIndex = storyIdx;
            currentPlotId = plotId;
            currentStepId = stepId || (storyList[storyIdx].steps[0] ? storyList[storyIdx].steps[0].stepId : 1);
            renderAll();
        },
        getState: function() {
            return { currentPlotId: currentPlotId, currentStepId: currentStepId, currentStoryIndex: currentStoryIndex, storyList: storyList };
        }
    };

})();
</script>
</body>
</html>
