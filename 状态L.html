        <div class="stat-item"><span class="stat-label">👕 破损</span><div class="progress-bar"><div class="progress-fill bar-cloth" id="bar-zhouning-衣物破损度" style="width: 75%;"></div></div><span class="stat-value" id="val-zhouning-衣物破损度">75</span></div>
        <div class="stat-item"><span class="stat-label">☀️ 晒伤</span><div class="progress-bar"><div class="progress-fill bar-burn" id="bar-zhouning-晒伤程度" style="width: 10%;"></div></div><span class="stat-value" id="val-zhouning-晒伤程度">10</span></div>

<style>
  /* 保留你最喜欢的精致高阶毛玻璃视觉风格 */
  .survival-board-container { font-family: system-ui, -apple-system, sans-serif; background: rgba(20, 25, 35, 0.75) !important; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 14px; margin: 18px auto; max-width: 1000px; color: #f1f5f9; box-shadow: 0 12px 40px rgba(0,0,0,0.6); position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: 95%; z-index: 999999; box-sizing: border-box; }
  .env-status-bar { display: flex; justify-content: space-around; flex-wrap: wrap; gap: 12px; background: rgba(0, 0, 0, 0.4); border-radius: 10px; padding: 8px 16px; margin-bottom: 14px; border: 1px solid rgba(255,255,255,0.03); }
  .env-item { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .env-label { color: #94a3b8; }
  .env-val { color: #38bdf8; font-weight: bold; }
  
  .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; width: 100%; }
  .char-card { background: rgba(30, 41, 59, 0.55); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 12px; padding: 12px 14px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.05); display: block !important; }
  .user-card { background: rgba(14, 116, 144, 0.15); border-color: rgba(6, 182, 212, 0.25); }
  
  .char-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding-bottom: 8px; margin-bottom: 10px; }
  .char-name { font-size: 16px; font-weight: 700; color: #ffffff; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
  .char-identity { font-size: 11px; font-weight: 600; padding: 2px 8px; background: rgba(6, 182, 212, 0.2); border-radius: 6px; color: #22d3ee; }
  
  .stats-grid { display: flex; flex-direction: column; gap: 8px; width: 100%; }
  
  /* 解决对齐死穴的弹性格局 */
  .stat-item { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; height: 22px; width: 100%; clear: both; box-sizing: border-box; }
  .stat-label { width: 60px; min-width: 60px; color: #cbd5e1; font-weight: 500; text-align: left; display: inline-block; }
  
  .progress-bar { flex-grow: 1; height: 8px; background: rgba(0,0,0,0.6); border-radius: 4px; margin: 0 10px; overflow: hidden; border: 1px solid rgba(255,255,255,0.02); display: inline-block; position: relative; }
  .progress-fill { height: 100%; border-radius: 4px; transition: width 0.4s ease-in-out; display: block; }
  
  .bar-energy { background: linear-gradient(90deg, #e11d48, #fb7185); }
  .bar-food { background: linear-gradient(90deg, #ea580c, #f97316); }
  .bar-water { background: linear-gradient(90deg, #0284c7, #38bdf8); }
  .bar-health { background: linear-gradient(90deg, #16a34a, #4ade80); }
  .bar-stress { background: linear-gradient(90deg, #7c3aed, #a78bfa); }
  .bar-cloth { background: linear-gradient(90deg, #475569, #94a3b8); }
  .bar-burn { background: linear-gradient(90deg, #b91c1c, #f87171); }

  .stat-value { width: 30px; min-width: 30px; text-align: right; font-family: ui-monospace, monospace; font-weight: 600; color: #f1f5f9; display: inline-block; }
  .stat-badge { padding: 2px 8px; border-radius: 6px; font-size: 11.5px; background: rgba(255,255,255,0.08); color: #e2e8f0; border: 1px solid rgba(255,255,255,0.05); font-weight: 500; display: inline-block; max-width: 85px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #chat { margin-top: 220px !important; }
  .fa-shield-alt { display: none !important; }
</style>

<script>
(function() {
    // 采用原作者同款：深层级真名捕获强行穿透机制
    function fixUserName() {
        try {
            let realName = window.SillyTavern?.context?.user_name || window.user_name || "";
            if (!realName || realName === "{{user}}") {
                realName = document.getElementById('name_text')?.value || jQuery("#user_name").val() || jQuery(".user_name_text").text() || "主角";
            }
            const nameEl = document.getElementById('survival-player-realname');
            if (nameEl && nameEl.textContent !== realName) {
                nameEl.textContent = realName;
            }
        } catch(err) {}
    }

    // 采用原作者的核心密码：深度提取并消除斜杠映射的超级路径解析器
    function fetchValueFromTavernPool(variablesObj, keyPath) {
        if (!variablesObj) return null;
        
        // 1. 完全对齐长字符串（如："主角/体能"）
        if (variablesObj[keyPath] !== undefined && variablesObj[keyPath] !== null) return variablesObj[keyPath];
        
        // 2. 完美对齐带补丁前缀的斜杠（如："/主角/体能"）
        if (variablesObj["/" + keyPath] !== undefined && variablesObj["/" + keyPath] !== null) return variablesObj["/" + keyPath];
        
        // 3. 原作者同款：深度解构二层嵌套对象解析（如：variablesObj["主角"]["体能"]）
        const splitted = keyPath.split('/');
        if (splitted.length === 2) {
            const part1 = splitted[0];
            const part2 = splitted[1];
            if (variablesObj[part1] && variablesObj[part1][part2] !== undefined && variablesObj[part1][part2] !== null) {
                return variablesObj[part1][part2];
            }
        }
        return null;
    }

    function getLiveVariables() {
        // 【核心克隆技术】：原作者同款庞大默认字典兜底！一开局就拥有完全对齐的数值，永不空白
        let database = {
            '世界/当前日期': '第1天', '世界/时间': '正午', '世界/天气': '晴朗烈日',
            '主角/体能': 90, '主角/饱食度': 75, '主角/水分': 70, '主角/健康': 95, '主角/内心紧绷度': 50, '主角/衣物破损度': 30, '主角/晒伤程度': 0, '主角/情绪状态': '警惕本能',
            '苏澜/体能': 30, '苏澜/饱食度': 60, '苏澜/水分': 50, '苏澜/健康': 80, '苏澜/内心紧绷度': 75, '苏澜/衣物破损度': 85, '苏澜/晒伤程度': 5, '苏澜/情绪状态': '昏迷虚弱',
            '周宁/体能': 35, '周宁/饱食度': 55, '周宁/水分': 45, '周宁/健康': 70, '周宁/内心紧绷度': 85, '周宁/衣物破损度': 75, '周宁/晒伤程度': 10, '周宁/情绪状态': '昏迷紧绷'
        };

        try {
            let activePool = null;
            
            // 全通道捕获酒馆当前的全局变量池
            if (window.SillyTavern?.variables) { activePool = window.SillyTavern.variables; }
            else if (window.Mvu?.variables) { activePool = window.Mvu.variables; }
            else if (typeof window.getAllVariables === 'function') { activePool = window.getAllVariables(); }

            // 循环遍历，强制匹配对齐
            Object.keys(database).forEach(path => {
                // 原生 API 接口优先呼叫
                if (typeof window.get_variable === 'function') {
                    let res = window.get_variable(path);
                    if (res === undefined || res === null) res = window.get_variable("/" + path);
                    if (res !== undefined && res !== null && res !== '') {
                        database[path] = res;
                        return;
                    }
                }
                
                // 命中解析器进行匹配
                if (activePool) {
                    let matchedVal = fetchValueFromTavernPool(activePool, path);
                    if (matchedVal !== undefined && matchedVal !== null && matchedVal !== '') {
                        database[path] = matchedVal;
                    }
                }
            });
        } catch(e) { console.error("变量树对齐防护错误:", e); }
        return database;
    }

    function renderDOM() {
        fixUserName();
        const v = getLiveVariables();
        
        // 渲染世界环境状态
        document.getElementById('val-world-date').textContent = v['世界/当前日期'];
        document.getElementById('val-world-time').textContent = v['世界/时间'];
        document.getElementById('val-world-weather').textContent = v['世界/天气'];
        
        // 渲染三段角色核心看板数据
        ['主角', '苏澜', '周宁'].forEach(group => {
            const idKey = group === '主角' ? 'user' : group === '苏澜' ? 'sulan' : 'zhouning';
            const attrFields = ['体能', '饱食度', '水分', '健康', '内心紧绷度', '衣物破损度', '晒伤程度'];
            
            attrFields.forEach(f => {
                const val = v[`${group}/${f}`];
                const parsedNum = parseInt(val, 10);
                const num = (!isNaN(parsedNum)) ? parsedNum : 0;
                
                // 像素级对齐数值框
                const txtEl = document.getElementById(`val-${idKey}-${f}`);
                if (txtEl) txtEl.textContent = num;
                
                // 像素级对齐进度条
                const barEl = document.getElementById(`bar-${idKey}-${f}`);
                if (barEl) barEl.style.width = num + '%';
            });
            
            // 对齐文本情绪状态标签
            const emotionTxt = v[`${group}/情绪状态`];
            const badgeEl = document.getElementById(`badge-${idKey}-情绪状态`);
            if (badgeEl) badgeEl.textContent = emotionTxt;
        });
    }

    // 超频平滑轮询渲染，杜绝任何卡顿导致的渲染延误
    setInterval(renderDOM, 400);
    setTimeout(renderDOM, 50);
})();
</script>
