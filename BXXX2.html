    <style>
        /* ===== 原有全部样式（完全保留） ===== */
        :root {

            --border-color: hsla(var(--hue-primary), 30%, 55%, 0.08);
            --border-hover: hsla(var(--hue-primary), 30%, 65%, 0.20);
            --text-main: hsl(var(--hue-primary), 15%, 88%);

            --text-dim: hsl(var(--hue-primary), 10%, 45%);

            --shadow: hsla(var(--hue-primary), 20%, 30%, 0.12);

        .card-progress { width:100%; margin-top:6px; display:flex; flex-direction:column; gap:2px; } .card-progress .progress-label { display:flex; justify-content:space-between; font-size:0.45rem; color:var(--text-dim); letter-spacing:0.3px; } .card-progress .progress-track { width:100%; height:3px; background:hsla(var(--hue-primary),20%,30%,0.20); border-radius:4px; overflow:hidden; } .card-progress .progress-fill { height:100%; border-radius:4px; transition:width var(--transition-slow) ease; width:0%; position:relative; } .card-progress .progress-fill::after { content:''; position:absolute; top:0; left:0; right:0; bottom:0; background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,0.20) 50%,transparent 100%); animation:shimmer 2.5s ease-in-out infinite; }

        .drawer-scroll { height:calc(100% - 24px); overflow-y:auto; padding:0 20px 16px 20px; scrollbar-width:none; -ms-overflow-style:none; } .drawer-scroll::-webkit-scrollbar { width:0px; background:transparent; }
        .drawer-grid { display:grid; grid-template-columns:1fr 1.2fr 1fr; gap:24px; min-height:100%; align-items:start; } .drawer-col { display:flex; flex-direction:column; gap:10px; } .drawer-col .col-title { font-size:0.55rem; font-weight:600; color:var(--text-secondary); letter-spacing:1.5px; text-transform:uppercase; opacity:0.4; border-bottom:1px solid var(--border-color); padding-bottom:6px; }

                if(Object.keys(flat).some(k=>!k.includes('.'))) return flat;
                const result={}; for(const [key,val] of Object.entries(flat)){ const parts=key.split('.'); let cur=result; for(let i=0;i<parts.length-1;i++){ if(!cur[parts[i]])cur[parts[i]]={}; cur=cur[parts[i]]; } cur[parts[parts.length-1]]=val; } return result;
            }
            // 新增：flatten 函数（嵌套对象 → 扁平键值对）

                const result = {};
                for (const key in obj) {
                    const newKey = prefix ? `${prefix}.${key}` : key;
                    if (typeof obj[key] === 'object' && obj[key] !== null && !Array.isArray(obj[key])) {

            // ============================================================
            // 解析并执行 <UpdateVariable> 中的 _.set 命令
            // ============================================================
            function executeVariableUpdate(updateVarText, currentStatData) {
                if (!updateVarText) return currentStatData;

                const setMatches = updateVarText.match(/_.set\s*\(\s*['"]([^'"]+)['"]\s*,\s*([^,]+)\s*,\s*([^)]+)\s*\)/g);
                if (!setMatches) return currentStatData;

                const newData = JSON.parse(JSON.stringify(currentStatData || {}));

                for (const match of setMatches) {
                    const parts = match.match(/_.set\s*\(\s*['"]([^'"]+)['"]\s*,\s*([^,]+)\s*,\s*([^)]+)\s*\)/);
                    if (!parts) continue;

                    const path = parts[1];
                    const newValue = parts[3].trim();

                    let parsedValue;
                    if (newValue === 'true') parsedValue = true;
                    else if (newValue === 'false') parsedValue = false;
                    else if (newValue === 'null') parsedValue = null;
                    else if (newValue === 'undefined') parsedValue = undefined;
                    else if (!isNaN(newValue) && newValue !== '') parsedValue = Number(newValue);
                    else if (newValue.startsWith("'") && newValue.endsWith("'")) {
                        parsedValue = newValue.slice(1, -1);
                    } else if (newValue.startsWith('"') && newValue.endsWith('"')) {
                        parsedValue = newValue.slice(1, -1);
                    } else {
                        parsedValue = newValue;
                    }

                    const pathParts = path.split('.');
                    let current = newData;
                    for (let i = 0; i < pathParts.length - 1; i++) {
                        if (!current[pathParts[i]]) current[pathParts[i]] = {};
                        current = current[pathParts[i]];
                    }
                    current[pathParts[pathParts.length - 1]] = parsedValue;

                    console.log(`[变量执行] ✅ ${path} = ${parsedValue}`);
                }

                return newData;
            }

            // ============================================================
            // 流式监听优化
            // ============================================================
            let streamingHandlerIncremental, streamingHandlerFull, generationEndHandler;
            let rafId = null, pendingStreamText = '';

            function setupStreamingListeners() {
                if (streamingHandlerIncremental && typeof eventRemoveListener === 'function')
                    eventRemoveListener(iframe_events.STREAM_TOKEN_RECEIVED_INCREMENTALLY, streamingHandlerIncremental);
                if (streamingHandlerFull && typeof eventRemoveListener === 'function')
                    eventRemoveListener(iframe_events.STREAM_TOKEN_RECEIVED_FULLY, streamingHandlerFull);
                if (generationEndHandler && typeof eventRemoveListener === 'function')
                    eventRemoveListener(iframe_events.GENERATION_ENDED, generationEndHandler);

                streamingHandlerIncremental = function(text) {
                    if (!isStreaming) return;
                    streamingFullText += text;
                    pendingStreamText = streamingFullText;
                    if (rafId) cancelAnimationFrame(rafId);
                    rafId = requestAnimationFrame(() => {
                        const match = pendingStreamText.match(/<content>([\s\S]*?)(?:<\/content>|$)/);
                        if (match && match[1]) {
                            storyText.innerHTML = match[1].trim() + '<span class="streaming-cursor"></span>';
                            mainArea.scrollTop = mainArea.scrollHeight;
                        }
                        rafId = null;
                    });
                };

                streamingHandlerFull = function(text) {
                    if (!isStreaming) return;
                    const match = text.match(/<content>([\s\S]*?)(?:<\/content>|$)/);
                    if (match && match[1]) {
                        storyText.innerHTML = match[1].trim() + '<span class="streaming-cursor"></span>';
                        mainArea.scrollTop = mainArea.scrollHeight;
                    }
                };

                generationEndHandler = function() {
                    isStreaming = false;
                    setTimeout(() => {
                        if (streamingFullText) {
                            const match = streamingFullText.match(/<content>([\s\S]*?)<\/content>/);
                            if (match && match[1]) storyText.innerHTML = match[1].trim();
                        }
                        loadLatestMessage();
                    }, 300);
                };

                try {
                    if (typeof eventOn !== 'undefined' && typeof iframe_events !== 'undefined') {
                        eventOn(iframe_events.STREAM_TOKEN_RECEIVED_INCREMENTALLY, streamingHandlerIncremental);
                        eventOn(iframe_events.STREAM_TOKEN_RECEIVED_FULLY, streamingHandlerFull);
                        eventOn(iframe_events.GENERATION_ENDED, generationEndHandler);
                    }
                } catch (e) {}
            }

            // ============================================================
            // handleOptionClick - 单/多API分支（本地计算 + 持久化存储）
            // ============================================================
            async function handleOptionClick(text) {
                if (isGenerating) return;
                isGenerating = true;
                isStreaming = false;
                streamingFullText = '';
                document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
                freeInputSend && (freeInputSend.disabled = true);
                showToast('📤 发送: ' + text);

                // 清理旧消息伪同层
                const chatEl = document.getElementById('chat');
                if (chatEl) {
                    const mes = chatEl.querySelectorAll('.mes');
                    if (mes.length > 1) {
                        const toRemove = [];
                        for (let i = 0; i < mes.length - 1; i++) {
                            mes[i].style.visibility = 'hidden';
                            mes[i].style.position = 'absolute';
                            mes[i].style.pointerEvents = 'none';
                            toRemove.push(mes[i]);
                        }
                        requestAnimationFrame(() => {
                            toRemove.forEach(el => el.remove());
                        });
                    }
                }

                let newStatData = null; // 保存本地计算结果

                try {
                    const config = getSecondApiConfig();
                    const isMulti = config.enabled;
                    let variables = {};
                    try {
                        let rawData = null;
                        if (typeof getVariables === 'function') {
                            const ctx = typeof SillyTavern !== 'undefined' ? SillyTavern.getContext() : null;
                            const latestIndex = ctx && ctx.chat ? ctx.chat.length - 1 : null;
                            if (latestIndex !== null && latestIndex >= 0) {
                                const result = getVariables({ type: 'message', message_id: latestIndex });
                                if (result && result.stat_data) rawData = result.stat_data;
                            }
                        }
                        if (!rawData && typeof getAllVariables === 'function') {
                            const allVars = getAllVariables();
                            rawData = allVars.stat_data || allVars;
                        }
                        variables = unflatten(rawData || {});
                    } catch (e) {}

                    if (isMulti) {
                        // 多 API 模式
                        if (typeof generate !== 'function') { showToast('❌ generate 不可用'); return; }
                        isStreaming = true;
                        setupStreamingListeners();
                        const result = await generate({ user_input: text, should_stream: true });
                        isStreaming = false;
                        const maintext = extractMaintext(result || streamingFullText);
                        const options = parseOptions(result || streamingFullText);
                        if (!maintext) { showToast('❌ 主AI未输出正文'); return; }
                        let finalMessage = `<content>${maintext}</content>\n<StatusPlaceHolderImpl/>\n`;
                        if (options.length > 0) finalMessage += `<options>${options.join('|')}</options>`;
                        showToast('⏳ 第二AI 正在处理变量...');
                        const updateVar = await callSecondApiForVariable(maintext, variables);
                        if (updateVar) finalMessage += '\n' + updateVar;

                        if (updateVar) {
                            try {
                                const ctx = typeof SillyTavern !== 'undefined' ? SillyTavern.getContext() : null;
                                newStatData = executeVariableUpdate(updateVar, variables || {});
                                console.log('[变量执行] ✅ 本地计算完成 (多API)');
                            } catch (e) {
                                console.error('[变量执行] 计算失败:', e);
                            }
                        }

                        if (typeof createChatMessages === 'function') {
                            // 将计算好的变量扁平化，随消息一起存入楼层
                            const flatData = newStatData ? flatten(newStatData) : {};
                            await createChatMessages([{ 
                                role: 'assistant', 
                                message: finalMessage,
                                data: { stat_data: flatData }
                            }], { refresh: 'none' });
                            showToast('✅ 回复完成');
                            console.log('[持久化] ✅ 变量已随消息写入楼层');
                        } else showToast('❌ 无法创建消息');

                        setTimeout(() => {
                            loadLatestMessage();
                            statusBar.classList.add('visible');
                            if (newStatData) {
                                renderStatusBar(unflatten(newStatData));
                            } else {
                                renderStatusBar();
                            }
                        }, 800);

                    } else {
                        // 单 API 模式
                        if (typeof generate !== 'function') { showToast('❌ generate 不可用'); return; }
                        isStreaming = true;
                        setupStreamingListeners();
                        const result = await generate({ user_input: text, should_stream: true });
                        isStreaming = false;

                        if (!result) { showToast('❌ 生成失败'); return; }

                        const maintext = extractMaintext(result) || result;
                        const options = parseOptions(result);
                        let updateVar = await callSecondApiForVariable(maintext, variables);
                        if (!updateVar) {
                            updateVar = extractUpdateVariable(result);
                        }

                        let finalMessage = result;
                        if (updateVar && !extractUpdateVariable(result)) {
                            finalMessage = result + '\n' + updateVar;
                        }

                        if (updateVar) {
                            try {
                                const ctx = typeof SillyTavern !== 'undefined' ? SillyTavern.getContext() : null;
                                newStatData = executeVariableUpdate(updateVar, variables || {});
                                console.log('[变量执行] ✅ 本地计算完成 (单API)');
                            } catch (e) {
                                console.error('[变量执行] 计算失败:', e);
                            }
                        }

                        if (typeof createChatMessages === 'function') {
                            const flatData = newStatData ? flatten(newStatData) : {};
                            await createChatMessages([{ 
                                role: 'assistant', 
                                message: finalMessage,
                                data: { stat_data: flatData }
                            }], { refresh: 'none' });
                            showToast('✅ 回复完成');
                            console.log('[持久化] ✅ 变量已随消息写入楼层');
                        } else {
                            showToast('❌ 无法创建消息');
                        }

                        setTimeout(() => {
                            loadLatestMessage();
                            statusBar.classList.add('visible');
                            if (newStatData) {
                                renderStatusBar(unflatten(newStatData));
                            } else {
                                renderStatusBar();
                            }
                        }, 800);
                    }

                } catch (error) {
                    console.error('[同层] 发送失败:', error);
                    showToast('❌ 发送失败: ' + error.message);
                    isStreaming = false;
                } finally {
                    setTimeout(() => {
                        document.querySelectorAll('.option-btn').forEach(b => b.disabled = false);
                        freeInputSend && (freeInputSend.disabled = false);
                        isGenerating = false;
                    }, 2000);
                }
            }
            // ============================================================
            // handleRevar - 单独重roll变量（本地计算 + 持久化存储）
            // ============================================================
            async function handleRevar() {
                revarOverlay.classList.remove('open');
                if (isGenerating) { showToast('⏳ 正在生成中，请稍后'); return; }
                let raw = '';
                try {
                    const ctx = typeof SillyTavern !== 'undefined' ? SillyTavern.getContext() : null;
                    if (ctx && ctx.chat && ctx.chat.length > 0) {
                        const last = ctx.chat[ctx.chat.length - 1];
                        if (last && last.mes) raw = last.mes;
                    }
                } catch (e) {}
                if (!raw) raw = getRawMessage();
                if (!raw) { showToast('❌ 没有可重roll的楼层'); return; }
                const maintext = extractMaintext(raw);
                if (!maintext) { showToast('❌ 没有找到正文'); return; }
                showToast('🔄 正在重新计算变量...');
                let newStatData = null;
                try {
                    let variables = {};
                    try {
                        let rawData = null;
                        if (typeof getVariables === 'function') {
                            const ctx = typeof SillyTavern !== 'undefined' ? SillyTavern.getContext() : null;
                            const latestIndex = ctx && ctx.chat ? ctx.chat.length - 1 : null;
                            if (latestIndex !== null && latestIndex >= 0) {
                                const result = getVariables({ type: 'message', message_id: latestIndex });
                                if (result && result.stat_data) rawData = result.stat_data;
                            }
                        }
                        if (!rawData && typeof getAllVariables === 'function') {
                            const allVars = getAllVariables();
                            rawData = allVars.stat_data || allVars;
                        }
                        variables = unflatten(rawData || {});
                    } catch (e) {}
                    const cleanedRaw = removeUpdateVariable(raw);
                    const updateVar = await callSecondApiForVariable(maintext, variables);

                    if (updateVar) {
                        const finalMessage = cleanedRaw + '\n' + updateVar;

                        try {
                            const ctx = typeof SillyTavern !== 'undefined' ? SillyTavern.getContext() : null;
                            newStatData = executeVariableUpdate(updateVar, variables || {});
                            console.log('[变量执行] ✅ 本地计算完成 (revar)');
                        } catch (e) {
                            console.error('[变量执行] 计算失败:', e);
                        }

                        const msgId = getMessageId();
                        if (msgId >= 0 && typeof setChatMessages === 'function') {
                            const flatData = newStatData ? flatten(newStatData) : {};
                            await setChatMessages([{ 
                                message_id: msgId, 
                                message: finalMessage,
                                data: { stat_data: flatData }
                            }], { refresh: 'affected' });
                            showToast('✅ 变量已重roll（已持久化）');
                            console.log('[持久化] ✅ 重roll变量已写入楼层');
                            setTimeout(() => {
                                loadLatestMessage();
                                statusBar.classList.add('visible');
                                if (newStatData) {
                                    renderStatusBar(unflatten(newStatData));
                                } else {
                                    renderStatusBar();
                                }
                            }, 500);
                        } else showToast('❌ 无法替换楼层');
                    } else showToast('⚠️ 第二API未返回变量更新');
                } catch (e) { showToast('❌ 重roll失败: ' + e.message); }
            }

            // ============================================================
            // loadLatestMessage - 加载最新消息
            // ============================================================
            function loadLatestMessage() {
                try {
                    if (isStreaming) return;
                    let raw = '';
                    try {
                        const ctx = typeof SillyTavern !== 'undefined' ? SillyTavern.getContext() : null;
                        if (ctx && ctx.chat && ctx.chat.length > 0) {
                            const last = ctx.chat[ctx.chat.length - 1];
                            if (last && last.mes) raw = last.mes;
                        }
                    } catch (e) {}
                    if (!raw) {
                        raw = getRawMessage();
                    }
                    renderMain(raw, false);
                } catch (e) {
                    storyText.innerHTML = '<div class="loading-text">❌ 加载失败</div>';
                }
            }

            // ============================================================
            // onMessageUpdate - 防抖刷新
            // ============================================================
            function onMessageUpdate() {
                if (isStreaming) return;
                if (refreshTimer) {
                    clearTimeout(refreshTimer);
                    refreshTimer = null;
                }
                refreshTimer = setTimeout(() => {
                    loadLatestMessage();
                    renderStatusBar();
                    refreshTimer = null;
                }, 400);
            }

            // ============================================================
            // toggleFullscreen - 全屏切换
            // ============================================================
            function toggleFullscreen() {
                const doc = document.documentElement;
                if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                    (doc.requestFullscreen || doc.webkitRequestFullscreen).call(doc).catch(() => {});
                    isFullscreen = true;
                    freeInputRow.style.display = 'flex';
                    showToast('🔲 全屏模式 (自由输入已开启)');
                } else {
                    (document.exitFullscreen || document.webkitExitFullscreen).call(document).catch(() => {});
                    isFullscreen = false;
                    freeInputRow.style.display = 'none';
                    showToast('🔳 退出全屏');
                }
            }

            // ============================================================
            // setMode - 模式切换
            // ============================================================
            async function setMode(mode) {
                currentMode = mode;
                modeBtns.forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
                modeBadge.textContent = mode === 'single' ? '1' : '2';
                modeBadge.style.background = mode === 'single' ? 'hsl(270,25%,60%)' : 'hsl(150,45%,50%)';
                const data = JSON.parse(localStorage.getItem('ds_settings_v2') || '{}');
                data.mode = mode;
                saveSettingsToStorage(data);
                const group = $('#secondApiGroup');
                if (group) {
                    group.style.opacity = mode === 'multi' ? '1' : '0.4';
                    group.style.pointerEvents = mode === 'multi' ? 'auto' : 'none';
                }
                await syncWorldbookForMode(mode);
            }

            // ============================================================
            // 设置面板
            // ============================================================
            function openSettings() { settingsOverlay.classList.add('open'); }
            function closeSettings() { settingsOverlay.classList.remove('open'); }

            function loadSettings() {
                try {
                    const raw = localStorage.getItem('ds_settings_v2');
                    if (!raw) return;
                    const data = JSON.parse(raw);
                    if (data.apiUrl) apiUrl.value = data.apiUrl;
                    if (data.apiKey) apiKey.value = data.apiKey;
                    if (data.apiModel) apiModel.value = data.apiModel;
                    if (data.apiTimeout) apiTimeout.value = data.apiTimeout;
                    if (data.apiRetries) apiRetries.value = data.apiRetries;
                    if (data.mode) {
                        setMode(data.mode);
                        const group = $('#secondApiGroup');
                        if (group) {
                            group.style.opacity = data.mode === 'multi' ? '1' : '0.4';
                            group.style.pointerEvents = data.mode === 'multi' ? 'auto' : 'none';
                        }
                    }
                    if (data.models && Array.isArray(data.models)) {
                        availableModels = data.models;
                        renderModelList(availableModels);
                    }
                } catch (e) {}
            }

            async function testApiConnection() {
                const url = apiUrl.value.trim(), key = apiKey.value.trim();
                if (!url || !key) { showToast('⚠️ 请填写 URL 和 API Key'); return; }
                apiStatus.textContent = '⏳ 测试中...';
                try {
                    const resp = await fetch(url.replace(/\/$/, '') + '/models', {
                        headers: { 'Authorization': 'Bearer ' + key },
                        signal: AbortSignal.timeout(10000)
                    });
                    if (resp.ok) {
                        const data = await resp.json();
                        const models = data.data ? data.data.map(m => m.id) : [];
                        apiStatus.textContent = '✅ 成功 (' + models.length + ' 模型)';
                    } else apiStatus.textContent = '❌ ' + resp.status;
                } catch (e) { apiStatus.textContent = '❌ ' + (e.name === 'TimeoutError' ? '超时' : e.message); }
            }

            async function fetchModels() {
                const url = apiUrl.value.trim(), key = apiKey.value.trim();
                if (!url || !key) { showToast('⚠️ 请填写 URL 和 API Key'); return; }
                apiStatus.textContent = '⏳ 获取中...';
                try {
                    const resp = await fetch(url.replace(/\/$/, '') + '/models', {
                        headers: { 'Authorization': 'Bearer ' + key },
                        signal: AbortSignal.timeout(10000)
                    });
                    if (resp.ok) {
                        const data = await resp.json();
                        const models = data.data ? data.data.map(m => m.id) : [];
                        if (models.length) {
                            availableModels = models;
                            renderModelList(models);
                            if (!apiModel.value.trim()) apiModel.value = models[0];
                            const cfg = JSON.parse(localStorage.getItem('ds_settings_v2') || '{}');
                            cfg.models = models;
                            saveSettingsToStorage(cfg);
                            showToast('📋 已获取 ' + models.length + ' 个模型');
                            apiStatus.textContent = '✅ 已获取 ' + models.length + ' 个模型';
                        } else showToast('⚠️ 未找到可用模型');
                    } else showToast('❌ 获取失败: ' + resp.status);
                } catch (e) { showToast('❌ ' + (e.name === 'TimeoutError' ? '超时' : e.message)); }
            }

            function clearAllConfig() {
                if (!confirm('确定清除所有第二API配置吗？')) return;
                apiUrl.value = ''; apiKey.value = ''; apiModel.value = ''; apiTimeout.value = '30000'; apiRetries.value = '3';
                apiStatus.textContent = '⏸ 已清除';
                availableModels = []; clearModelList();
                localStorage.removeItem('ds_settings_v2');
                showToast('🗑️ 已清除所有第二API配置');
            }

            function forceIframeHeight() {
                try {
                    if (window.parent && window.parent.postMessage) window.parent.postMessage({ type: 'tavern-height', height: document.documentElement.scrollHeight + 80 }, '*');
                    const iframe = window.frameElement;
                    if (iframe && iframe.parentNode) { iframe.style.height = '100vh'; iframe.style.minHeight = '100vh'; }
                } catch (e) {}
            }

            // ============================================================
            // 伪同层优化：MutationObserver + 事件双重保障
            // ============================================================
            function setupPseudoSingleLayer() {
                const chat = document.getElementById('chat');
                if (!chat) return setTimeout(setupPseudoSingleLayer, 500);

                const cleanOld = () => {
                    const mes = chat.querySelectorAll('.mes');
                    if (mes.length > 1) {
                        const toRemove = [];
                        for (let i = 0; i < mes.length - 1; i++) {
                            mes[i].style.visibility = 'hidden';
                            mes[i].style.position = 'absolute';
                            mes[i].style.pointerEvents = 'none';
                            toRemove.push(mes[i]);
                        }
                        requestAnimationFrame(() => {
                            toRemove.forEach(el => el.remove());
                        });
                    }
                };

                const observer = new MutationObserver(() => requestAnimationFrame(cleanOld));
                observer.observe(chat, { childList: true, subtree: false });

                if (typeof eventOn === 'function') {
                    eventOn(tavern_events.MESSAGE_RECEIVED, () => requestAnimationFrame(cleanOld));
                    eventOn(tavern_events.MESSAGE_SENT, () => requestAnimationFrame(cleanOld));
                }
            }

            // 长按重roll
            let longPressTimer;
            function setupLongPress() {
                const el = storyText;
                if (!el) return;
                el.addEventListener('mousedown', () => { longPressTimer = setTimeout(() => revarOverlay.classList.add('open'), 800); });
                el.addEventListener('mouseup', () => clearTimeout(longPressTimer));
                el.addEventListener('mouseleave', () => clearTimeout(longPressTimer));
                el.addEventListener('touchstart', () => { longPressTimer = setTimeout(() => revarOverlay.classList.add('open'), 800); });
                el.addEventListener('touchend', () => clearTimeout(longPressTimer));
                el.addEventListener('touchmove', () => clearTimeout(longPressTimer));
            }

            // ============================================================
            // 事件绑定
            // ============================================================
            fullscreenBtn.addEventListener('click', toggleFullscreen);
            document.addEventListener('keydown', (e) => {
                if (e.key === 'f' || e.key === 'F') { if (!e.ctrlKey && !e.metaKey) toggleFullscreen(); }
                if (e.key === 's' || e.key === 'S') { if (!e.ctrlKey && !e.metaKey) openSettings(); }
                if (e.key === 'Escape') { closeSettings(); revarOverlay.classList.remove('open'); }
            });
            modeToggleBtn.addEventListener('click', async () => { await setMode(currentMode === 'single' ? 'multi' : 'single'); });
            modeBtns.forEach(btn => btn.addEventListener('click', async () => { await setMode(btn.dataset.mode); }));
            settingsBtn.addEventListener('click', openSettings);
            settingsClose.addEventListener('click', closeSettings);
            settingsOverlay.addEventListener('click', e => { if (e.target === settingsOverlay) closeSettings(); });
            testApiBtn.addEventListener('click', testApiConnection);
            fetchModelsBtn.addEventListener('click', fetchModels);
            clearAllBtn.addEventListener('click', clearAllConfig);
            modelListToggle.addEventListener('click', toggleModelList);
            optionsGrid.addEventListener('click', e => {
                const btn = e.target.closest('.option-btn');
                if (btn && !btn.disabled) handleOptionClick(btn.dataset.text);
            });

            freeInputSend.addEventListener('click', () => {
                const text = freeInputText.value.trim();
                if (text) {
                    const chatEl = document.getElementById('chat');
                    if (chatEl) {
                        const mes = chatEl.querySelectorAll('.mes');
                        if (mes.length > 1) {
                            const toRemove = [];
                            for (let i = 0; i < mes.length - 1; i++) {
                                mes[i].style.visibility = 'hidden';
                                mes[i].style.position = 'absolute';
                                mes[i].style.pointerEvents = 'none';
                                toRemove.push(mes[i]);
                            }
                            requestAnimationFrame(() => {
                                toRemove.forEach(el => el.remove());
                            });
                        }
                    }
                    handleOptionClick(text);
                    freeInputText.value = '';
                }
            });
            freeInputText.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    const text = freeInputText.value.trim();
                    if (text) {
                        const chatEl = document.getElementById('chat');
                        if (chatEl) {
                            const mes = chatEl.querySelectorAll('.mes');
                            if (mes.length > 1) {
                                const toRemove = [];
                                for (let i = 0; i < mes.length - 1; i++) {
                                    mes[i].style.visibility = 'hidden';
                                    mes[i].style.position = 'absolute';
                                    mes[i].style.pointerEvents = 'none';
                                    toRemove.push(mes[i]);
                                }
                                requestAnimationFrame(() => {
                                    toRemove.forEach(el => el.remove());
                                });
                            }
                        }
                        handleOptionClick(text);
                        freeInputText.value = '';
                    }
                }
            });

            revarConfirm.addEventListener('click', handleRevar);
            revarCancel.addEventListener('click', () => revarOverlay.classList.remove('open'));
            revarOverlay.addEventListener('click', e => { if (e.target === revarOverlay) revarOverlay.classList.remove('open'); });

            // 消息更新监听（兜底逻辑）
            if (typeof eventOn === 'function') {
                try {
                    eventOn('message_updated', onMessageUpdate);
                    eventOn('message_received', onMessageUpdate);
                    if (typeof tavern_events !== 'undefined') {
                        eventOn(tavern_events.MESSAGE_UPDATED, onMessageUpdate);
                        eventOn(tavern_events.MESSAGE_RECEIVED, onMessageUpdate);
                    }
                } catch (e) {}
            } else setInterval(loadLatestMessage, 3000);

            // ============================================================
            // 配色切换逻辑（保留原实现）
            // ============================================================
            const themeBtns = document.querySelectorAll('.theme-btn');
            const THEME_MAP = {
                'purple': 'theme-purple',
                'amber': 'theme-amber',
                'glass': 'theme-glass',
            };

            function setTheme(themeKey) {
                document.body.classList.remove('theme-purple', 'theme-amber', 'theme-glass');
                if (themeKey !== 'warm') {
                    document.body.classList.add(THEME_MAP[themeKey]);
                }
                themeBtns.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.theme === themeKey);
                });
                try { localStorage.setItem('ds_theme', themeKey); } catch(e) {}
            }

            function loadTheme() {
                try {
                    const saved = localStorage.getItem('ds_theme');
                    if (saved && saved !== 'warm' && THEME_MAP[saved]) {
                        setTheme(saved);
                        return;
                    }
                } catch(e) {}
                document.body.classList.remove('theme-purple', 'theme-amber', 'theme-glass');
                themeBtns.forEach(btn => btn.classList.remove('active'));
            }

            themeBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    setTheme(this.dataset.theme);
                    showToast('🎨 已切换配色');
                });
            });

            // ============================================================
            // 初始化
            // ============================================================
            loadTheme();
            loadSettings();
            setupStreamingListeners();
            setupLongPress();
            setupPseudoSingleLayer();
            modelListContainer.classList.remove('open');
            modelListArrow.classList.remove('open');
            freeInputRow.style.display = 'none';
            setTimeout(() => {
                loadLatestMessage();
                setTimeout(forceIframeHeight, 300);
                setTimeout(forceIframeHeight, 800);
            }, 200);
            console.log('[同层] ✅ 已加载, 模式:', currentMode);
        })();
    </script>
</body>
</html>
