<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>为了让我考上高校 · 欢迎</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&family=Noto+Serif+SC:wght@400;700;900&display=swap" rel="stylesheet" />

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: 350, 55%, 45%;
            --secondary: 35, 50%, 50%;
            --bg-dark: 0, 0%, 6%;
            --bg-card: 350, 20%, 10%;
            --text-main: 30, 15%, 88%;
            --text-muted: 30, 10%, 50%;
        }

        body {
            min-height: 100vh;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', 'PingFang SC', 'Noto Serif SC', system-ui, sans-serif;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 720px;
            width: 100%;
            background: hsla(var(--bg-dark), 0.85);
            backdrop-filter: blur(24px) saturate(1.4);
            -webkit-backdrop-filter: blur(24px) saturate(1.4);
            border-radius: 8px;
            border: 1px solid hsla(var(--primary), 0.12);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
            padding: 36px 32px 28px;
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(30px) scale(0.98);
            animation: containerIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes containerIn {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .container::before {
            content: '';
            position: absolute;
            top: -30%;
            right: -20%;
            width: 70%;
            height: 80%;
            background: radial-gradient(ellipse, hsla(var(--primary), 0.06), transparent 60%);
            pointer-events: none;
            animation: drift 14s infinite alternate ease-in-out;
        }
        .container::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -20%;
            width: 60%;
            height: 70%;
            background: radial-gradient(ellipse, hsla(var(--secondary), 0.04), transparent 60%);
            pointer-events: none;
            animation: drift2 18s infinite alternate-reverse ease-in-out;
        }

        @keyframes drift {
            0% { transform: translate(0,0) scale(1); opacity: 0.3; }
            100% { transform: translate(-10%, 8%) scale(1.3); opacity: 0.7; }
        }
        @keyframes drift2 {
            0% { transform: translate(0,0) scale(1); opacity: 0.2; }
            100% { transform: translate(8%, -6%) scale(1.3); opacity: 0.6; }
        }

        .container > * { position: relative; z-index: 2; }

        .header {
            text-align: center;
            margin-bottom: 16px;
        }

        .title-glitch {
            position: relative;
            display: inline-block;
            font-family: 'Noto Serif SC', serif;
            font-weight: 900;
            font-size: clamp(1.6rem, 5vw, 2.8rem);
            letter-spacing: 0.08em;
            color: hsl(30, 15%, 92%);
            text-shadow: 0 0 30px hsla(var(--primary), 0.08);
        }

        .title-glitch .glitch-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            opacity: 0.4;
            mix-blend-mode: screen;
        }
        .title-glitch .glitch-layer:nth-child(2) {
            color: hsl(var(--primary));
            transform: translate(2px, -2px);
            animation: glitch1 3.2s infinite alternate;
        }
        .title-glitch .glitch-layer:nth-child(3) {
            color: hsl(var(--secondary));
            transform: translate(-2px, 2px);
            animation: glitch2 2.8s infinite alternate;
        }

        @keyframes glitch1 {
            0%, 90% { transform: translate(2px, -2px); opacity: 0.3; }
            92% { transform: translate(-3px, 3px); opacity: 0.8; }
            94% { transform: translate(4px, -2px); opacity: 0.1; }
            96% { transform: translate(-2px, 2px); opacity: 0.5; }
            100% { transform: translate(2px, -2px); opacity: 0.3; }
        }
        @keyframes glitch2 {
            0%, 88% { transform: translate(-2px, 2px); opacity: 0.3; }
            90% { transform: translate(3px, -3px); opacity: 0.7; }
            93% { transform: translate(-4px, 4px); opacity: 0.1; }
            95% { transform: translate(3px, -2px); opacity: 0.4; }
            100% { transform: translate(-2px, 2px); opacity: 0.3; }
        }

        .title-sub {
            font-size: clamp(0.5rem, 1.2vw, 0.7rem);
            font-weight: 300;
            color: hsla(var(--text-muted), 0.5);
            letter-spacing: 6px;
            margin-top: 4px;
            font-family: 'Inter', sans-serif;
        }
        .title-author {
            font-size: clamp(0.4rem, 1vw, 0.55rem);
            color: hsla(30, 10%, 55%, 0.35);
            letter-spacing: 4px;
            margin-top: 6px;
            font-weight: 300;
        }
        .title-author strong {
            color: hsl(var(--secondary), 0.6);
            font-weight: 600;
        }

        .hero-image {
            position: relative;
            margin: 0 0 18px 0;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid hsla(var(--primary), 0.08);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
            aspect-ratio: 16 / 5.5;
            background: hsla(var(--bg-card), 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-image .img-placeholder {
            color: hsla(var(--text-muted), 0.15);
            font-size: 0.65rem;
            letter-spacing: 4px;
            font-weight: 300;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .hero-image .img-placeholder .icon {
            font-size: 2rem;
            opacity: 0.15;
        }
        .hero-image .img-placeholder .text {
            opacity: 0.2;
        }

        .hero-image .overlay-dark {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, hsla(0, 0%, 0%, 0.20), hsla(var(--primary), 0.05));
        }
        .hero-image .caption {
            position: relative;
            z-index: 2;
            padding: 20px 16px 18px;
            text-align: center;
            color: hsl(30, 15%, 92%);
            font-size: clamp(0.6rem, 1.6vw, 0.85rem);
            letter-spacing: 3px;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            height: 100%;
            font-weight: 300;
            font-family: 'Noto Serif SC', serif;
        }
        .hero-image .caption .caption-bold {
            font-weight: 700;
            color: hsl(30, 15%, 95%);
            letter-spacing: 4px;
            text-shadow: 0 0 30px hsla(var(--primary), 0.2), 0 2px 20px rgba(0, 0, 0, 0.7);
        }

        .story-area {
            background: hsla(var(--bg-card), 0.30);
            border: 1px solid hsla(var(--primary), 0.04);
            border-radius: 4px;
            padding: 22px 26px 18px;
            margin-bottom: 18px;
            max-height: 300px;
            overflow-y: auto;
            position: relative;
            transition: border-color 0.4s ease;
            scrollbar-width: thin;
            scrollbar-color: hsla(var(--primary), 0.12) transparent;
        }
        .story-area::-webkit-scrollbar { width: 3px; }
        .story-area::-webkit-scrollbar-track { background: transparent; }
        .story-area::-webkit-scrollbar-thumb { background: hsla(var(--primary), 0.15); border-radius: 1px; }

        .story-area:hover { border-color: hsla(var(--primary), 0.08); }

        .story-area .story-label {
            font-size: 0.5rem;
            font-weight: 600;
            letter-spacing: 3px;
            color: hsla(var(--text-muted), 0.2);
            text-transform: uppercase;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            font-family: 'Inter', sans-serif;
        }
        .story-area .story-label svg {
            width: 14px; height: 14px;
            fill: none;
            stroke: hsla(var(--secondary), 0.15);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .typewriter-content {
            font-family: 'Noto Serif SC', 'PingFang SC', serif;
            font-size: clamp(0.7rem, 1.4vw, 0.85rem);
            font-weight: 300;
            line-height: 2.0;
            color: hsla(30, 10%, 85%, 0.75);
            letter-spacing: 0.5px;
            position: relative;
            min-height: 60px;
        }

        .typewriter-content .paragraph {
            display: block;
            text-indent: 2em;
            margin-bottom: 0.6em;
        }
        .typewriter-content .paragraph:last-child { margin-bottom: 0; }

        .typewriter-content .divider-line {
            display: block;
            text-align: center;
            font-size: 0.5rem;
            letter-spacing: 8px;
            color: hsla(var(--secondary), 0.08);
            margin: 0.1em 0 0.4em 0;
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        .typewriter-content .divider-line.show { opacity: 1; }

        .typewriter-content .cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: hsl(var(--secondary));
            margin-left: 2px;
            vertical-align: text-bottom;
            animation: blink 0.9s step-end infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .typewriter-content .cursor.done {
            animation: blink 1.2s step-end infinite;
            opacity: 0.5;
        }

        .skip-hint {
            position: absolute;
            bottom: 8px;
            right: 14px;
            font-size: 0.45rem;
            color: hsla(30, 10%, 50%, 0.12);
            letter-spacing: 2px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        .skip-hint.show { opacity: 1; }

        .story-area.done {
            border-color: hsla(var(--primary), 0.04);
        }
        .story-area.done .skip-hint { opacity: 0; }

        .action { text-align: center; margin: 0 0 14px; }

        .btn-enter {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            width: 100%;
            padding: 16px 28px;
            border-radius: 4px;
            background: hsla(var(--primary), 0.04);
            border: 1px solid hsla(var(--primary), 0.10);
            color: hsl(30, 15%, 92%);
            font-size: clamp(0.8rem, 1.8vw, 1.0rem);
            font-weight: 500;
            letter-spacing: 6px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            font-family: 'Inter', 'Noto Serif SC', sans-serif;
            position: relative;
            overflow: hidden;
        }
        .btn-enter::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, hsla(var(--primary), 0.03), hsla(var(--secondary), 0.02));
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .btn-enter:hover::before { opacity: 1; }
        .btn-enter:hover {
            background: hsla(var(--primary), 0.06);
            border-color: hsla(var(--primary), 0.18);
            box-shadow: 0 0 40px hsla(var(--primary), 0.03);
            transform: translateY(-2px);
        }
        .btn-enter:active {
            transform: scale(0.97) translateY(0);
            transition-duration: 0.05s;
        }

        .btn-enter .btn-icon-svg {
            width: 20px; height: 20px;
            fill: none;
            stroke: hsla(var(--secondary), 0.4);
            stroke-width: 1.8;
            stroke-linecap: round; stroke-linejoin: round;
            transition: all 0.4s ease;
            flex-shrink: 0;
        }
        .btn-enter:hover .btn-icon-svg {
            stroke: hsla(var(--secondary), 0.7);
            transform: translateX(4px);
        }

        .btn-enter .btn-glow-ring {
            position: absolute;
            inset: -1px;
            border-radius: 4px;
            padding: 1px;
            background: linear-gradient(135deg, hsla(var(--primary), 0.08), transparent 60%, hsla(var(--secondary), 0.04));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .btn-enter:hover .btn-glow-ring { opacity: 1; }

        .footer {
            text-align: center;
            padding-top: 14px;
            border-top: 1px solid hsla(var(--primary), 0.03);
            font-size: 0.45rem;
            color: hsla(30, 10%, 45%, 0.2);
            letter-spacing: 3px;
            font-weight: 300;
        }
        .footer .footer-deco {
            font-size: 0.6rem;
            opacity: 0.2;
            margin-bottom: 4px;
            letter-spacing: 6px;
            animation: pulseDeco 3s ease-in-out infinite;
        }
        @keyframes pulseDeco {
            0%, 100% { opacity: 0.1; }
            50% { opacity: 0.35; }
        }
        .footer span { color: hsla(30, 10%, 50%, 0.2); }

        @media (max-width: 640px) {
            body { padding: 10px; }
            .container {
                border-radius: 6px;
                padding: 24px 16px 20px;
            }
            .hero-image {
                border-radius: 4px;
                margin-bottom: 14px;
                aspect-ratio: 16 / 4.5;
            }
            .hero-image .caption {
                font-size: 0.55rem;
                padding: 14px 12px;
                letter-spacing: 2px;
            }
            .story-area {
                padding: 16px 16px 14px;
                border-radius: 4px;
                max-height: 220px;
            }
            .typewriter-content { font-size: 0.65rem; line-height: 1.9; }
            .btn-enter {
                padding: 14px 20px;
                font-size: 0.7rem;
                letter-spacing: 4px;
                gap: 12px;
                border-radius: 4px;
            }
            .btn-enter .btn-icon-svg { width: 17px; height: 17px; }
            .footer { font-size: 0.4rem; }
            .skip-hint {
                font-size: 0.4rem;
                bottom: 6px;
                right: 10px;
            }
            .typewriter-content .paragraph { text-indent: 1.6em; }
        }

        @media (max-width: 400px) {
            .container {
                padding: 16px 10px 14px;
                border-radius: 4px;
            }
            .title-glitch { font-size: 1.2rem; }
            .title-sub { font-size: 0.45rem; letter-spacing: 4px; }
            .hero-image { aspect-ratio: 16 / 4; border-radius: 4px; }
            .hero-image .caption { font-size: 0.5rem; letter-spacing: 2px; padding: 10px 8px; }
            .story-area { padding: 12px 12px 10px; max-height: 180px; }
            .typewriter-content { font-size: 0.58rem; line-height: 1.8; }
            .btn-enter {
                padding: 12px 16px;
                font-size: 0.6rem;
                letter-spacing: 3px;
                gap: 10px;
                border-radius: 4px;
            }
            .typewriter-content .paragraph { text-indent: 1.4em; }
        }

        @media (min-width: 641px) and (max-width: 900px) {
            .container { padding: 30px 24px 24px; }
            .story-area { padding: 20px 22px 16px; max-height: 260px; }
        }
    </style>
</head>
<body>

    <div class="container" id="app">

        <header class="header">
            <div class="title-glitch">
                沉沦
                <span class="glitch-layer" aria-hidden="true">沉沦</span>
                <span class="glitch-layer" aria-hidden="true">沉沦</span>
            </div>
            <div class="title-sub">—— 为了让我考上高校，妈妈成为了我的性处理肉便器母狗 ——</div>
            <div class="title-author">作者 · <strong>三年的水</strong></div>
        </header>

        <div class="hero-image" id="heroImage">
            <div class="img-placeholder">
                <span class="icon">◈</span>
    <img src="https://testingcf.jsdelivr.net/gh/sanshui19516/CG@main/%E7%8E%8B%E6%98%A5%E9%A3%8E%E6%AC%A2%E8%BF%8E.png
" style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0;" />
            </div>
            <div class="overlay-dark"></div>
            <div class="caption">
                <span class="caption-bold">她用「为了高考」说服了自己</span>
            </div>
        </div>

        <div class="story-area" id="storyArea">
            <div class="story-label">
                <svg viewBox="0 0 24 24"><polyline points="4 7 4 4 20 4 20 7"/><line x1="4" y1="10" x2="20" y2="10"/><line x1="4" y1="14" x2="20" y2="14"/><line x1="4" y1="18" x2="16" y2="18"/></svg>
                故事简介
            </div>
            <div class="typewriter-content" id="typewriter"></div>
            <div class="skip-hint" id="skipHint">✦ 点击任意位置跳过 ✦</div>
        </div>

        <div class="action">
            <button class="btn-enter" onclick="switchOpening(1)">
                <span>开始</span>
                <svg class="btn-icon-svg" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                <span class="btn-glow-ring"></span>
            </button>
        </div>

        <div class="footer">
            <div class="footer-deco">✦ 请多多评论 ✦</div>
            <span>by 三年的水</span>
        </div>

    </div>

    <script>
        async function switchOpening(swipeId) {
            var clickedCard = event.currentTarget;
            clickedCard.style.opacity = '0.6';
            clickedCard.style.pointerEvents = 'none';
            try {
                var messages;
                try {
                    messages = await getChatMessages?.('0', { include_swipe: true });
                } catch (e) {
                    var context = window.SillyTavern?.getContext?.();
                    messages = context?.chat?.messages;
                }
                if (!messages || messages.length === 0) throw new Error('没有找到聊天消息。');
                var userMessage = messages[0];
                if (!userMessage.swipes) throw new Error('第一条消息没有滑动条。');
                if (userMessage.swipes.length <= swipeId) throw new Error('滑动条 ' + swipeId + ' 不存在。');
                var targetSwipe = userMessage.swipes[swipeId];
                var setChatMessage = window.setChatMessage || window.SillyTavern?.getContext?.()?.setChatMessage;
                if (typeof setChatMessage === 'function') {
                    await setChatMessage(targetSwipe, 0, { swipe_id: swipeId, refresh: 'display_and_render_current' });
                } else if (typeof userMessage.setSwipe === 'function') {
                    userMessage.setSwipe(swipeId);
                }
            } catch (error) {
                console.error('切换失败:', error);
            } finally {
                clickedCard.style.opacity = '1';
                clickedCard.style.pointerEvents = 'auto';
            }
        }

        var storyParagraphs = [
            '2005年，中国S市。重点高中附近的高档小区里，王春凤和儿子住在一起。她的全部生活就是围着儿子转——做饭、洗衣、督促学习。丈夫常年在外应酬，很少回家。',
            '儿子成绩下滑了。她急了，说了很重的话。可那天晚上，儿子推开了她的房门。他说：「妈，你答应我一件事，我就好好学。」',
            '她用「为了高考」说服了自己。第一次妥协的时候，她告诉自己：就这一次。可身体一旦被彻底满足，那些压抑多年的欲望就像决堤的水，再也收不回来了。',
            '从穿旗袍敲开房门，到被顶到最深处时哭着说不要，屁股却自己往后挺。她说服自己这一切都是为了让儿子考上好大学。可每一次高潮，都在告诉她另一件事：她已经回不去了。'
        ];

        var CHAR_INTERVAL = 22;
        var PARAGRAPH_PAUSE = 400;

        var typewriterEl = document.getElementById('typewriter');
        var skipHint = document.getElementById('skipHint');
        var storyArea = document.getElementById('storyArea');

        var isTyping = false;
        var isDone = false;
        var timer = null;

        function buildFullHTML() {
            var html = '';
            for (var i = 0; i < storyParagraphs.length; i++) {
                html += '<span class="paragraph">' + storyParagraphs[i] + '</span>';
                if (i < storyParagraphs.length - 1) {
                    html += '<span class="divider-line show">✦ ✦ ✦</span>';
                }
            }
            return html;
        }

        function startTypewriter() {
            if (!typewriterEl) return;
            if (isTyping || isDone) return;

            isTyping = true;
            typewriterEl.innerHTML = '';
            if (skipHint) skipHint.classList.remove('show');

            var charQueue = [];
            for (var pIdx = 0; pIdx < storyParagraphs.length; pIdx++) {
                var p = storyParagraphs[pIdx];
                charQueue.push({ type: 'paragraph-start', index: pIdx });
                for (var cIdx = 0; cIdx < p.length; cIdx++) {
                    charQueue.push({ type: 'char', char: p[cIdx], paragraph: pIdx });
                }
                charQueue.push({ type: 'paragraph-end', index: pIdx });
            }

            var queueIndex = 0;
            var currentParagraph = null;

            function typeNext() {
                if (queueIndex >= charQueue.length) {
                    isTyping = false;
                    isDone = true;
                    if (storyArea) storyArea.classList.add('done');

                    var cursor = document.createElement('span');
                    cursor.className = 'cursor done';
                    cursor.textContent = ' ';
                    typewriterEl.appendChild(cursor);
                    if (skipHint) skipHint.classList.add('show');

                    if (storyArea) storyArea.scrollTop = storyArea.scrollHeight;
                    return;
                }

                var item = charQueue[queueIndex];

                if (item.type === 'paragraph-start') {
                    currentParagraph = document.createElement('span');
                    currentParagraph.className = 'paragraph';
                    typewriterEl.appendChild(currentParagraph);
                    queueIndex++;
                    timer = setTimeout(typeNext, 40);
                    return;
                }

                if (item.type === 'paragraph-end') {
                    if (item.index < storyParagraphs.length - 1) {
                        var divider = document.createElement('span');
                        divider.className = 'divider-line';
                        divider.textContent = '✦ ✦ ✦';
                        typewriterEl.appendChild(divider);
                        setTimeout(function() { divider.classList.add('show'); }, 50);
                        queueIndex++;
                        timer = setTimeout(typeNext, PARAGRAPH_PAUSE);
                        return;
                    } else {
                        queueIndex++;
                        timer = setTimeout(typeNext, 30);
                        return;
                    }
                }

                if (item.type === 'char') {
                    if (currentParagraph) {
                        var textNode = document.createTextNode(item.char);
                        currentParagraph.appendChild(textNode);
                    }
                    queueIndex++;
                    timer = setTimeout(typeNext, CHAR_INTERVAL);
                    return;
                }

                queueIndex++;
                timer = setTimeout(typeNext, CHAR_INTERVAL);
            }

            timer = setTimeout(typeNext, 300);
        }

        function skipTypewriter() {
            if (!isTyping && isDone) return;
            if (timer) { clearTimeout(timer); timer = null; }
            isTyping = false;
            isDone = true;
            if (storyArea) storyArea.classList.add('done');

            typewriterEl.innerHTML = buildFullHTML();

            var cursor = document.createElement('span');
            cursor.className = 'cursor done';
            cursor.textContent = ' ';
            typewriterEl.appendChild(cursor);
            if (skipHint) skipHint.classList.add('show');

            if (storyArea) storyArea.scrollTop = storyArea.scrollHeight;
        }

        if (storyArea) {
            storyArea.addEventListener('click', function(e) {
                if (isTyping) skipTypewriter();
            });
            storyArea.addEventListener('touchstart', function(e) {
                if (isTyping) skipTypewriter();
            }, { passive: true });
        }

        setTimeout(startTypewriter, 100);
    </script>

</body>
</html>
