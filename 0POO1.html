<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>杂鱼♥ · 欢迎</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', 'PingFang SC', system-ui, -apple-system, sans-serif;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 720px;
            width: 100%;
            background: hsla(260, 15%, 6%, 0.78);
            backdrop-filter: blur(32px) saturate(1.6);
            -webkit-backdrop-filter: blur(32px) saturate(1.6);
            border-radius: 48px;
            border: 1px solid hsla(280, 60%, 60%, 0.12);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.7), inset 0 0 0 1px hsla(280, 60%, 60%, 0.04), 0 0 160px -60px hsla(280, 60%, 60%, 0.06);
            padding: 36px 32px 28px;
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(30px) scale(0.98);
            animation: containerIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes containerIn {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .container::before {
            content: '';
            position: absolute;
            top: -30%; right: -20%;
            width: 70%; height: 80%;
            background: radial-gradient(ellipse, hsla(280, 60%, 60%, 0.06), transparent 65%);
            pointer-events: none;
            animation: driftPurple 14s infinite alternate ease-in-out;
        }
        .container::after {
            content: '';
            position: absolute;
            bottom: -30%; left: -20%;
            width: 60%; height: 70%;
            background: radial-gradient(ellipse, hsla(260, 50%, 50%, 0.04), transparent 65%);
            pointer-events: none;
            animation: driftBlue 18s infinite alternate-reverse ease-in-out;
        }
        @keyframes driftPurple {
            0% { transform: translate(0, 0) scale(1); opacity: 0.3; }
            100% { transform: translate(-10%, 8%) scale(1.4); opacity: 0.8; }
        }
        @keyframes driftBlue {
            0% { transform: translate(0, 0) scale(1); opacity: 0.2; }
            100% { transform: translate(8%, -6%) scale(1.3); opacity: 0.7; }
        }

        .container>* { position: relative; z-index: 2; }

        .header { text-align: center; margin-bottom: 16px; }

        .title-glitch {
            position: relative;
            display: inline-block;
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: clamp(1.4rem, 5vw, 2.8rem);
            letter-spacing: 0.04em;
            color: hsl(260, 10%, 92%);
            text-shadow: 0 0 30px hsla(280, 60%, 60%, 0.10);
        }
        .title-glitch .glitch-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            opacity: 0.5;
            mix-blend-mode: screen;
        }
        .title-glitch .glitch-layer:nth-child(2) {
            color: hsl(280, 60%, 60%);
            transform: translate(2px, -2px);
            animation: glitchShift1 3.2s infinite alternate;
        }
        .title-glitch .glitch-layer:nth-child(3) {
            color: hsl(260, 50%, 50%);
            transform: translate(-2px, 2px);
            animation: glitchShift2 2.8s infinite alternate;
        }
        @keyframes glitchShift1 {
            0%,90% { transform: translate(2px,-2px); opacity: 0.4; }
            92% { transform: translate(-4px,4px); opacity: 0.9; }
            94% { transform: translate(6px,-3px); opacity: 0.2; }
            96% { transform: translate(-2px,2px); opacity: 0.6; }
            100% { transform: translate(2px,-2px); opacity: 0.4; }
        }
        @keyframes glitchShift2 {
            0%,88% { transform: translate(-2px,2px); opacity: 0.4; }
            90% { transform: translate(3px,-3px); opacity: 0.8; }
            93% { transform: translate(-5px,5px); opacity: 0.15; }
            95% { transform: translate(4px,-2px); opacity: 0.5; }
            100% { transform: translate(-2px,2px); opacity: 0.4; }
        }

        .title-sub {
            font-size: clamp(0.55rem, 1.4vw, 0.8rem);
            font-weight: 300;
            color: hsla(260, 10%, 70%, 0.5);
            letter-spacing: 8px;
            margin-top: 4px;
            font-style: italic;
        }
        .title-author {
            font-size: clamp(0.45rem, 1vw, 0.6rem);
            color: hsla(260, 10%, 55%, 0.4);
            letter-spacing: 4px;
            margin-top: 6px;
            font-weight: 300;
        }
        .title-author strong { color: hsl(280, 60%, 50%); font-weight: 600; }

        .hero-image {
            position: relative;
            margin: 0 0 18px 0;
            border-radius: 28px;
            overflow: hidden;
            border: 1px solid hsla(280, 60%, 60%, 0.12);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.35);
            aspect-ratio: 16 / 5.5;
        }
        .hero-image .bg-layer {
            position: absolute;
            inset: 0;
            background-image: url('https://testingcf.jsdelivr.net/gh/sanshui19516/CG@main/00p%20(1).jpg');
            background-size: cover;
            background-position: center 30%;
            background-repeat: no-repeat;
        }
        .hero-image .overlay-dark {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, hsla(260, 15%, 5%, 0.50), hsla(280, 60%, 60%, 0.10), hsla(260, 50%, 50%, 0.06));
        }
        .hero-image .caption {
            position: relative;
            z-index: 2;
            padding: 20px 16px 18px;
            text-align: center;
            color: hsl(260, 10%, 92%);
            font-size: clamp(0.7rem, 2vw, 1.0rem);
            letter-spacing: 4px;
            font-style: italic;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            height: 100%;
            font-weight: 300;
        }
        .hero-image .caption .caption-bold {
            font-weight: 700;
            color: hsl(260, 10%, 95%);
            letter-spacing: 5px;
            text-shadow: 0 0 30px hsla(280, 60%, 60%, 0.3), 0 2px 20px rgba(0, 0, 0, 0.7);
        }

        .story-area {
            background: hsla(260, 12%, 6%, 0.40);
            border: 1px solid hsla(280, 60%, 60%, 0.06);
            border-radius: 24px;
            padding: 22px 26px 18px;
            margin-bottom: 18px;
            max-height: 300px;
            overflow-y: auto;
            position: relative;
            transition: border-color 0.4s ease;
            scrollbar-width: thin;
            scrollbar-color: hsla(280, 60%, 60%, 0.15) transparent;
        }
        .story-area::-webkit-scrollbar { width: 3px; }
        .story-area::-webkit-scrollbar-track { background: transparent; }
        .story-area::-webkit-scrollbar-thumb { background: hsla(280, 60%, 60%, 0.20); border-radius: 10px; }

        .story-area:hover { border-color: hsla(280, 60%, 60%, 0.12); }

        .story-area .story-label {
            font-size: 0.5rem;
            font-weight: 600;
            letter-spacing: 3px;
            color: hsla(260, 10%, 55%, 0.25);
            text-transform: uppercase;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .story-area .story-label svg {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: hsla(280, 60%, 60%, 0.2);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .typewriter-content {
            font-family: 'Inter', 'PingFang SC', system-ui, sans-serif;
            font-size: clamp(0.7rem, 1.4vw, 0.85rem);
            font-weight: 300;
            line-height: 2.0;
            color: hsla(260, 10%, 85%, 0.78);
            letter-spacing: 0.3px;
            position: relative;
            min-height: 60px;
        }

        .typewriter-content .paragraph {
            display: block;
            text-indent: 2em;
            margin-bottom: 0.6em;
        }
        .typewriter-content .paragraph:last-child { margin-bottom: 0; }

        .typewriter-content .divider-line {
            display: block;
            text-align: center;
            font-size: 0.5rem;
            letter-spacing: 8px;
            color: hsla(280, 60%, 60%, 0.12);
            margin: 0.1em 0 0.4em 0;
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        .typewriter-content .divider-line.show { opacity: 1; }

        .typewriter-content .cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: hsl(280, 60%, 50%);
            margin-left: 2px;
            vertical-align: text-bottom;
            animation: blink 0.9s step-end infinite;
        }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

        .typewriter-content .cursor.done {
            animation: blink 1.2s step-end infinite;
            opacity: 0.6;
        }

        .skip-hint {
            position: absolute;
            bottom: 8px;
            right: 14px;
            font-size: 0.5rem;
            color: hsla(260, 10%, 50%, 0.15);
            letter-spacing: 2px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        .skip-hint.show { opacity: 1; }
        .story-area.done { border-color: hsla(280, 60%, 60%, 0.08); }
        .story-area.done .skip-hint { opacity: 0; }

        .action { text-align: center; margin: 0 0 14px; }

        .btn-enter {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            width: 100%;
            padding: 16px 28px;
            border-radius: 60px;
            background: hsla(280, 60%, 60%, 0.04);
            border: 1px solid hsla(280, 60%, 60%, 0.12);
            color: hsl(260, 10%, 92%);
            font-size: clamp(0.8rem, 1.8vw, 1.0rem);
            font-weight: 500;
            letter-spacing: 4px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            font-family: 'Inter', sans-serif;
            position: relative;
            overflow: hidden;
        }
        .btn-enter::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, hsla(280, 60%, 60%, 0.03), hsla(260, 50%, 50%, 0.03));
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .btn-enter:hover::before { opacity: 1; }
        .btn-enter:hover {
            background: hsla(280, 60%, 60%, 0.08);
            border-color: hsla(280, 60%, 60%, 0.25);
            box-shadow: 0 0 50px hsla(280, 60%, 60%, 0.05), inset 0 0 0 1px hsla(280, 60%, 60%, 0.04);
            transform: translateY(-3px);
        }
        .btn-enter:active { transform: scale(0.96) translateY(0); transition-duration: 0.05s; }

        .btn-enter .btn-icon-svg {
            width: 22px; height: 22px;
            fill: none;
            stroke: hsla(280, 60%, 60%, 0.5);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all 0.4s ease;
            flex-shrink: 0;
        }
        .btn-enter:hover .btn-icon-svg {
            stroke: hsla(280, 60%, 60%, 0.9);
            transform: translateX(4px);
        }

        .btn-enter .btn-glow-ring {
            position: absolute;
            inset: -1px;
            border-radius: 60px;
            padding: 1px;
            background: linear-gradient(135deg, hsla(280, 60%, 60%, 0.12), transparent 60%, hsla(260, 50%, 50%, 0.06));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .btn-enter:hover .btn-glow-ring { opacity: 1; }

        .footer {
            text-align: center;
            padding-top: 14px;
            border-top: 1px solid hsla(280, 60%, 60%, 0.03);
            font-size: 0.5rem;
            color: hsla(260, 10%, 45%, 0.25);
            letter-spacing: 3px;
            font-weight: 300;
        }
        .footer .footer-deco {
            font-size: 0.65rem;
            opacity: 0.25;
            margin-bottom: 4px;
            letter-spacing: 4px;
            animation: pulseDeco 3s ease-in-out infinite;
        }
        @keyframes pulseDeco { 0%,100% { opacity: 0.12; } 50% { opacity: 0.4; } }
        .footer span { color: hsla(260, 10%, 50%, 0.25); }

        @media (max-width: 640px) {
            body { padding: 10px; }
            .container { border-radius: 32px; padding: 24px 16px 20px; }
            .hero-image { border-radius: 20px; margin-bottom: 14px; aspect-ratio: 16 / 4.5; }
            .hero-image .caption { font-size: 0.6rem; padding: 14px 12px; letter-spacing: 3px; }
            .story-area { padding: 16px 16px 14px; border-radius: 18px; max-height: 220px; }
            .typewriter-content { font-size: 0.68rem; line-height: 1.9; }
            .btn-enter { padding: 14px 20px; font-size: 0.7rem; letter-spacing: 3px; gap: 12px; }
            .btn-enter .btn-icon-svg { width: 18px; height: 18px; }
            .footer { font-size: 0.45rem; }
            .skip-hint { font-size: 0.4rem; bottom: 6px; right: 10px; }
            .typewriter-content .paragraph { text-indent: 1.6em; }
        }
        @media (max-width: 400px) {
            .container { padding: 16px 10px 14px; border-radius: 24px; }
            .title-glitch { font-size: 1.1rem; }
            .title-sub { font-size: 0.45rem; letter-spacing: 4px; }
            .hero-image { aspect-ratio: 16 / 4; border-radius: 16px; }
            .hero-image .caption { font-size: 0.5rem; letter-spacing: 2px; padding: 10px 8px; }
            .story-area { padding: 12px 12px 10px; max-height: 180px; }
            .typewriter-content { font-size: 0.6rem; line-height: 1.8; }
            .btn-enter { padding: 12px 16px; font-size: 0.6rem; letter-spacing: 2px; gap: 10px; }
            .typewriter-content .paragraph { text-indent: 1.4em; }
        }
        @media (min-width: 641px) and (max-width: 900px) {
            .container { padding: 30px 24px 24px; }
            .story-area { padding: 20px 22px 16px; max-height: 260px; }
        }
    </style>
</head>
<body>

    <div class="container" id="app">

        <header class="header">
            <div class="title-glitch">
                杂鱼♥ — 欧尼酱不会真的以为我在等你吧
                <span class="glitch-layer" aria-hidden="true">杂鱼♥ — 欧尼酱不会真的以为我在等你吧</span>
                <span class="glitch-layer" aria-hidden="true">杂鱼♥ — 欧尼酱不会真的以为我在等你吧</span>
            </div>
            <div class="title-sub">—— 猫耳与尾巴 · 嘴硬与真心 ——</div>
            <div class="title-author">作者 · <strong>佚名</strong></div>
        </header>

        <div class="hero-image" id="heroImage">
            <div class="bg-layer"></div>
            <div class="overlay-dark"></div>
            <div class="caption">
                <span class="caption-bold">「杂鱼♥——欧尼酱不会真的以为我在等你吧？」</span>
            </div>
        </div>

        <div class="story-area" id="storyArea">
            <div class="story-label">
                <svg viewBox="0 0 24 24"><polyline points="4 7 4 4 20 4 20 7"/><line x1="4" y1="10" x2="20" y2="10"/><line x1="4" y1="14" x2="20" y2="14"/><line x1="4" y1="18" x2="16" y2="18"/></svg>
                故事简介
            </div>
            <div class="typewriter-content" id="typewriter"></div>
            <div class="skip-hint" id="skipHint">✦ 点击任意位置跳过 ✦</div>
        </div>

        <div class="action">
            <button class="btn-enter" onclick="switchOpening(1)">
                <span>进入故事 · 猫耳与尾巴</span>
                <svg class="btn-icon-svg" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                <span class="btn-glow-ring"></span>
            </button>
        </div>

        <div class="footer">
            <div class="footer-deco">✦ 请多多评论 ✦</div>
            <span>by 佚名</span>
        </div>

    </div>

    <script>
        // ================================================================
        // 【1】跳转函数
        // ================================================================
        async function switchOpening(swipeId) {
            var clickedCard = event.currentTarget;
            clickedCard.style.opacity = '0.6';
            clickedCard.style.pointerEvents = 'none';
            try {
                var messages;
                try {
                    messages = await getChatMessages?.('0', { include_swipe: true });
                } catch (e) {
                    var context = window.SillyTavern?.getContext?.();
                    messages = context?.chat?.messages;
                }
                if (!messages || messages.length === 0) throw new Error('没有找到聊天消息。');
                var userMessage = messages[0];
                if (!userMessage.swipes) throw new Error('第一条消息没有滑动条。');
                if (userMessage.swipes.length <= swipeId) throw new Error('滑动条 ' + swipeId + ' 不存在。');
                var targetSwipe = userMessage.swipes[swipeId];
                var setChatMessage = window.setChatMessage || window.SillyTavern?.getContext?.()?.setChatMessage;
                if (typeof setChatMessage === 'function') {
                    await setChatMessage(targetSwipe, 0, { swipe_id: swipeId, refresh: 'display_and_render_current' });
                } else if (typeof userMessage.setSwipe === 'function') {
                    userMessage.setSwipe(swipeId);
                }
            } catch (error) {
                console.error('切换失败:', error);
            } finally {
                clickedCard.style.opacity = '1';
                clickedCard.style.pointerEvents = 'auto';
            }
        }

        // ================================================================
        // 【2】打字机引擎 — 不依赖 window.onload，直接执行 + 重试机制
        // ================================================================

        var storyParagraphs = [
            '双子星，16岁，高一学生。她是欧尼酱的义妹，也是这个家里最吵、最傲娇、最藏不住心事的存在。',
            '她习惯用「杂鱼♥」开头，用「欧尼酱大变态」结尾——中间夹着所有她不好意思说出口的话。她以为只要嘴上够凶，就能藏住尾巴尖朝向他时不经意的轻摆。',
            '欧尼酱知道吗？不知道。他好像总是很迟钝，不知道她蹲在玄关系了三次鞋带是为了等他一起出门，不知道她冰箱上的便利贴其实不是写给她自己的。',
            '这个故事的基调是：轻甜、日常、嘴硬与真心。猫尾巴比嘴诚实——你准备好发现她了吗？'
        ];

        var CHAR_INTERVAL = 20;
        var PARAGRAPH_PAUSE = 350;

        var typewriterEl = document.getElementById('typewriter');
        var skipHint = document.getElementById('skipHint');
        var storyArea = document.getElementById('storyArea');

        var isTyping = false;
        var isDone = false;
        var timer = null;

        // ---- 如果元素还没加载好，重试 ----
        if (!typewriterEl) {
            var retryCount = 0;
            var maxRetries = 20;

            function waitForElement() {
                typewriterEl = document.getElementById('typewriter');
                if (typewriterEl) {
                    setTimeout(startTypewriter, 150);
                    return;
                }
                retryCount++;
                if (retryCount < maxRetries) {
                    setTimeout(waitForElement, 200);
                } else {
                    console.warn('⚠️ 重试 ' + maxRetries + ' 次后仍未找到打字机元素');
                }
            }
            waitForElement();
        } else {
            setTimeout(startTypewriter, 150);
        }

        function buildFullHTML() {
            var html = '';
            for (var i = 0; i < storyParagraphs.length; i++) {
                html += '<span class="paragraph">' + storyParagraphs[i] + '</span>';
                if (i < storyParagraphs.length - 1) {
                    html += '<span class="divider-line show">✦ ✦ ✦</span>';
                }
            }
            return html;
        }

        function startTypewriter() {
            if (isTyping || isDone) return;
            if (!typewriterEl) return;

            isTyping = true;
            typewriterEl.innerHTML = '';
            if (skipHint) skipHint.classList.remove('show');

            var charQueue = [];
            for (var pIdx = 0; pIdx < storyParagraphs.length; pIdx++) {
                var p = storyParagraphs[pIdx];
                charQueue.push({ type: 'paragraph-start', index: pIdx });
                for (var cIdx = 0; cIdx < p.length; cIdx++) {
                    charQueue.push({ type: 'char', char: p[cIdx], paragraph: pIdx });
                }
                charQueue.push({ type: 'paragraph-end', index: pIdx });
            }

            var queueIndex = 0;
            var currentParagraph = null;

            function typeNext() {
                if (queueIndex >= charQueue.length) {
                    isTyping = false;
                    isDone = true;
                    if (storyArea) storyArea.classList.add('done');

                    var cursor = document.createElement('span');
                    cursor.className = 'cursor done';
                    cursor.textContent = ' ';
                    typewriterEl.appendChild(cursor);
                    if (skipHint) skipHint.classList.add('show');

                    if (storyArea) storyArea.scrollTop = storyArea.scrollHeight;
                    return;
                }

                var item = charQueue[queueIndex];

                if (item.type === 'paragraph-start') {
                    currentParagraph = document.createElement('span');
                    currentParagraph.className = 'paragraph';
                    typewriterEl.appendChild(currentParagraph);
                    queueIndex++;
                    timer = setTimeout(typeNext, 40);
                    return;
                }

                if (item.type === 'paragraph-end') {
                    if (item.index < storyParagraphs.length - 1) {
                        var divider = document.createElement('span');
                        divider.className = 'divider-line';
                        divider.textContent = '✦ ✦ ✦';
                        typewriterEl.appendChild(divider);
                        setTimeout(function() { divider.classList.add('show'); }, 50);
                        queueIndex++;
                        timer = setTimeout(typeNext, PARAGRAPH_PAUSE);
                        return;
                    } else {
                        queueIndex++;
                        timer = setTimeout(typeNext, 30);
                        return;
                    }
                }

                if (item.type === 'char') {
                    if (currentParagraph) {
                        var textNode = document.createTextNode(item.char);
                        currentParagraph.appendChild(textNode);
                    }
                    queueIndex++;
                    timer = setTimeout(typeNext, CHAR_INTERVAL);
                    return;
                }

                queueIndex++;
                timer = setTimeout(typeNext, CHAR_INTERVAL);
            }

            timer = setTimeout(typeNext, 300);
        }

        function skipTypewriter() {
            if (!isTyping && isDone) return;
            if (timer) {
                clearTimeout(timer);
                timer = null;
            }
            isTyping = false;
            isDone = true;
            if (storyArea) storyArea.classList.add('done');

            typewriterEl.innerHTML = buildFullHTML();

            var cursor = document.createElement('span');
            cursor.className = 'cursor done';
            cursor.textContent = ' ';
            typewriterEl.appendChild(cursor);
            if (skipHint) skipHint.classList.add('show');

            if (storyArea) storyArea.scrollTop = storyArea.scrollHeight;
        }

        if (storyArea) {
            storyArea.addEventListener('click', function(e) {
                if (isTyping) skipTypewriter();
            });
            storyArea.addEventListener('touchstart', function(e) {
                if (isTyping) skipTypewriter();
            }, { passive: true });
        }
    </script>

</body>
</html>
