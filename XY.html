<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>青梅的救赎 · 作者声明</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />

    <!-- GSAP + EasePack -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/EasePack.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0e0a12;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            padding: 20px;
        }

        .declaration {
            max-width: 820px;
            width: 100%;
            background: rgba(18, 14, 28, 0.78);
            backdrop-filter: blur(24px) saturate(1.6);
            -webkit-backdrop-filter: blur(24px) saturate(1.6);
            border-radius: 48px;
            border: 1px solid rgba(255, 215, 215, 0.06);
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.7),
                inset 0 0 0 1px rgba(255, 215, 215, 0.04),
                0 0 120px -40px rgba(180, 120, 200, 0.08);
            padding: 36px 32px 32px;
            position: relative;
            overflow: hidden;
        }

        /* 默认所有卡片可见，动画只做淡入，不改变最终状态 */
        .declaration .header,
        .declaration .card,
        .declaration .gallery,
        .declaration .action,
        .declaration .footer {
            opacity: 0; /* 初始透明，由GSAP淡入 */
        }

        .declaration::before {
            content: '';
            position: absolute;
            top: -30%;
            right: -20%;
            width: 70%;
            height: 80%;
            background: radial-gradient(ellipse, rgba(180, 120, 210, 0.06), transparent 70%);
            pointer-events: none;
            animation: driftGlow 12s infinite alternate ease-in-out;
        }
        @keyframes driftGlow {
            0% { transform: translate(0, 0) scale(1); opacity: 0.4; }
            100% { transform: translate(-10%, 8%) scale(1.3); opacity: 0.8; }
        }

        .header {
            position: relative;
            z-index: 2;
            margin-bottom: 28px;
            text-align: center;
        }

        .title-glitch {
            position: relative;
            display: inline-block;
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: clamp(1.8rem, 6vw, 3.2rem);
            letter-spacing: 0.04em;
            color: #f2e8f0;
            text-shadow: 0 0 20px rgba(200, 160, 220, 0.15);
        }
        .title-glitch .glitch-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.6;
            mix-blend-mode: screen;
        }
        .title-glitch .glitch-layer:nth-child(2) {
            color: #e8a0b8;
            transform: translate(2px, -2px);
            animation: glitchShift1 3s infinite alternate;
        }
        .title-glitch .glitch-layer:nth-child(3) {
            color: #90c8e8;
            transform: translate(-2px, 2px);
            animation: glitchShift2 2.8s infinite alternate;
        }
        @keyframes glitchShift1 {
            0%, 90% { transform: translate(2px, -2px); opacity: 0.5; }
            92% { transform: translate(-4px, 4px); opacity: 0.9; }
            94% { transform: translate(6px, -3px); opacity: 0.3; }
            96% { transform: translate(-2px, 2px); opacity: 0.7; }
            100% { transform: translate(2px, -2px); opacity: 0.5; }
        }
        @keyframes glitchShift2 {
            0%, 88% { transform: translate(-2px, 2px); opacity: 0.5; }
            90% { transform: translate(3px, -3px); opacity: 0.8; }
            93% { transform: translate(-5px, 5px); opacity: 0.2; }
            95% { transform: translate(4px, -2px); opacity: 0.6; }
            100% { transform: translate(-2px, 2px); opacity: 0.5; }
        }

        .title-sub {
            font-size: clamp(0.8rem, 2vw, 1.1rem);
            font-weight: 300;
            color: #b8a8c0;
            letter-spacing: 6px;
            margin-top: 6px;
            font-style: italic;
            border-top: 1px solid rgba(255, 215, 215, 0.06);
            padding-top: 10px;
            display: inline-block;
        }
        .title-author {
            font-size: clamp(0.65rem, 1.4vw, 0.8rem);
            color: #9a8aa0;
            letter-spacing: 3px;
            margin-top: 8px;
            font-weight: 300;
        }
        .title-author strong {
            color: #d4c0d8;
            font-weight: 600;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            position: relative;
            z-index: 2;
            margin-bottom: 18px;
        }

        .card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 215, 215, 0.05);
            border-radius: 24px;
            padding: 18px 18px 14px;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            transition: all 0.3s ease;
        }
        .card:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(200, 160, 220, 0.15);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }

        .card-label {
            font-size: 0.6rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: #a898b0;
            text-transform: uppercase;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(255, 215, 215, 0.04);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-label svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: #b8a8c0;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .card-list {
            list-style: none;
            padding: 0;
        }
        .card-list li {
            font-size: clamp(0.65rem, 1.4vw, 0.75rem);
            color: #c8bcc8;
            line-height: 1.7;
            padding-left: 14px;
            position: relative;
        }
        .card-list li::before {
            content: '◆';
            position: absolute;
            left: 0;
            color: #705a78;
            font-size: 0.4rem;
            top: 0.5em;
        }
        .card-list .tag-allow { color: #a0c8a0; }
        .card-list .tag-warn { color: #d8a0a8; }
        .card-list .tag-note { color: #b8a8b8; }

        .gallery {
            position: relative;
            z-index: 2;
            margin: 18px 0 22px;
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid rgba(255, 215, 215, 0.05);
        }
        .gallery-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 10px 14px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: rgba(200, 160, 220, 0.15) transparent;
            background: rgba(0, 0, 0, 0.15);
        }
        .gallery-scroll::-webkit-scrollbar {
            height: 4px;
        }
        .gallery-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .gallery-scroll::-webkit-scrollbar-thumb {
            background: rgba(200, 160, 220, 0.2);
            border-radius: 10px;
        }

        .gallery-item {
            flex: 0 0 auto;
            width: 140px;
            scroll-snap-align: start;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.3s ease;
            aspect-ratio: 3 / 4;
        }
        .gallery-item:hover {
            border-color: rgba(200, 160, 220, 0.3);
            transform: scale(1.02);
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        @media (max-width: 480px) {
            .gallery-item { width: 100px; }
        }

        .action {
            position: relative;
            z-index: 2;
            text-align: center;
            margin-top: 8px;
        }

        .btn-enter {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            padding: 16px 42px;
            border-radius: 60px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 215, 215, 0.08);
            color: #f0e8f0;
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            font-weight: 500;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.35s ease;
            text-decoration: none;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            box-shadow: 0 0 0 0 rgba(200, 160, 220, 0);
            font-family: 'Inter', sans-serif;
        }
        .btn-enter:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(200, 160, 220, 0.25);
            box-shadow: 0 0 30px rgba(200, 160, 220, 0.06), inset 0 0 0 1px rgba(255, 255, 255, 0.04);
            transform: translateY(-2px);
        }
        .btn-enter:active {
            transform: scale(0.96);
        }
        .btn-enter svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: #e0d0e0;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.3s ease;
        }
        .btn-enter:hover svg {
            transform: translateX(4px);
        }

        .footer {
            position: relative;
            z-index: 2;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 215, 215, 0.04);
            text-align: center;
            font-size: 0.6rem;
            color: #7a6a80;
            letter-spacing: 2px;
            font-weight: 300;
        }
        .footer span {
            color: #9a8aa0;
        }

        @media (max-width: 640px) {
            body { padding: 10px; }
            .declaration { padding: 22px 16px 22px; border-radius: 32px; }
            .grid { grid-template-columns: 1fr; gap: 10px; }
            .card { padding: 14px 14px 12px; border-radius: 18px; }
            .btn-enter { padding: 14px 28px; font-size: 0.85rem; gap: 10px; }
            .gallery-item { width: 80px; }
        }

        @media (min-width: 641px) and (max-width: 900px) {
            .declaration { padding: 30px 24px 26px; }
            .grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

    <div class="declaration" id="declaration">

        <header class="header">
            <div class="title-glitch">
                青梅的救赎
                <span class="glitch-layer" aria-hidden="true">青梅的救赎</span>
                <span class="glitch-layer" aria-hidden="true">青梅的救赎</span>
            </div>
            <div class="title-sub">—— 总裁的性瘾强迫性渴望 ——</div>
            <div class="title-author">作者 · <strong>三年的水</strong></div>
        </header>

        <div class="grid">
            <div class="card">
                <div class="card-label">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                    发布信息
                </div>
                <ul class="card-list">
                    <li>🛑 仅发布于 <span style="color:#e0d0e0;">Discord 类脑、旅程</span></li>
                    <li>🛑 作者：<span style="color:#e0d0e0;">三年的水</span></li>
                </ul>
            </div>

            <div class="card">
                <div class="card-label">
                    <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>
                    授权说明
                </div>
                <ul class="card-list">
                    <li><span class="tag-allow">✅ 允许二改（署名）</span></li>
                    <li><span class="tag-allow">✅ 二改后需标注出处</span></li>
                    <li><span class="tag-warn">❌ 禁止商用</span></li>
                    <li><span class="tag-warn">❌ 禁止墙内二传</span></li>
                </ul>
            </div>

            <div class="card">
                <div class="card-label">
                    <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="18" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                    本卡包含
                </div>
                <ul class="card-list">
                    <li>完整故事 · 商战与救赎</li>
                    <li>开场白 · 办公室重逢</li>
                    <li>温晚婉 · CSBD 设定</li>
                    <li>投决会 · 顶层公寓 · 迈巴赫</li>
                </ul>
            </div>

            <div class="card">
                <div class="card-label">
                    <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                    使用说明
                </div>
                <ul class="card-list">
                    <li>导入角色卡到 SillyTavern</li>
                    <li>开始对话体验</li>
                </ul>
            </div>
        </div>

        <div class="gallery">
            <div class="gallery-scroll">
                <div class="gallery-item"><img src="https://testingcf.jsdelivr.net/gh/sanshui19516/CG@main/%E6%80%A7%E7%98%BE1%20(1).jpg" alt="Scene 1" loading="lazy" /></div>
                <div class="gallery-item"><img src="https://testingcf.jsdelivr.net/gh/sanshui19516/CG@main/%E6%80%A7%E7%98%BE1%20(2).jpg" alt="Scene 2" loading="lazy" /></div>
                <div class="gallery-item"><img src="https://testingcf.jsdelivr.net/gh/sanshui19516/CG@main/%E6%80%A7%E7%98%BE1%20(3).jpg" alt="Scene 3" loading="lazy" /></div>
                <div class="gallery-item"><img src="https://testingcf.jsdelivr.net/gh/sanshui19516/CG@main/%E6%80%A7%E7%98%BE1%20(4).jpg" alt="Scene 4" loading="lazy" /></div>
                <div class="gallery-item"><img src="https://testingcf.jsdelivr.net/gh/sanshui19516/CG@main/%E6%80%A7%E7%98%BE1%20(5).jpg" alt="Scene 5" loading="lazy" /></div>
                <div class="gallery-item"><img src="https://testingcf.jsdelivr.net/gh/sanshui19516/CG@main/%E6%80%A7%E7%98%BE1%20(6).jpg" alt="Scene 6" loading="lazy" /></div>
            </div>
        </div>

        <div class="action">
            <button class="btn-enter" id="enterBtn">
                <span>进入 · 游玩</span>
                <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </button>
        </div>

        <div class="footer">
            请多多评论 · <span>by 三年的水</span>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 使用 GSAP 制作入场淡入动画，结束后保持 opacity:1
            const tl = gsap.timeline({
                defaults: { ease: 'power2.out', duration: 0.8 }
            });

            // 选择所有需要动画的元素
            const header = document.querySelector('.header');
            const cards = document.querySelectorAll('.card');
            const gallery = document.querySelector('.gallery');
            const action = document.querySelector('.action');
            const footer = document.querySelector('.footer');

            // 先设置所有元素透明（CSS已设 opacity:0，但以防万一）
            gsap.set([header, cards, gallery, action, footer], { opacity: 0 });

            // 渐入动画 —— 每个元素从0到1，并保持最终状态
            tl.to(header, { opacity: 1, y: 0, duration: 0.8, ease: 'power3.out' })
              .to(cards, { opacity: 1, y: 0, duration: 0.6, stagger: 0.08, ease: 'power2.out' }, '-=0.3')
              .to(gallery, { opacity: 1, y: 0, duration: 0.7, ease: 'power2.out' }, '-=0.2')
              .to(action, { opacity: 1, y: 0, duration: 0.6, ease: 'power2.out' }, '-=0.2')
              .to(footer, { opacity: 1, duration: 0.5, ease: 'power2.out' }, '-=0.2');

            // 卡片悬停微动（不用GSAP，用CSS即可，但保留GSAP版本）
            cards.forEach(c => {
                c.addEventListener('mouseenter', () => {
                    gsap.to(c, { scale: 1.01, duration: 0.25, ease: 'power1.out' });
                });
                c.addEventListener('mouseleave', () => {
                    gsap.to(c, { scale: 1, duration: 0.3, ease: 'power1.out' });
                });
            });

            // 按钮点击 —— 切换开场白
            document.getElementById('enterBtn').addEventListener('click', async function(e) {
                const btn = this;
                btn.style.opacity = '0.6';
                btn.style.pointerEvents = 'none';
                try {
                    let messages;
                    try {
                        messages = await getChatMessages?.('0', { include_swipe: true });
                    } catch (_) {
                        const context = window.SillyTavern?.getContext?.();
                        messages = context?.chat?.messages;
                    }
                    if (!messages || messages.length === 0) throw new Error('未找到聊天消息');
                    const firstMsg = messages[0];
                    if (!firstMsg.swipes) throw new Error('没有滑动条');
                    const targetSwipe = firstMsg.swipes[0];
                    const setChatMessage = window.setChatMessage || window.SillyTavern?.getContext?.()?.setChatMessage;
                    if (typeof setChatMessage === 'function') {
                        await setChatMessage(targetSwipe, 0, { swipe_id: 0, refresh: 'display_and_render_current' });
                    } else if (typeof firstMsg.setSwipe === 'function') {
                        firstMsg.setSwipe(0);
                    }
                } catch (err) {
                    console.warn('切换开场白失败:', err);
                } finally {
                    btn.style.opacity = '1';
                    btn.style.pointerEvents = 'auto';
                }
            });
        });
    </script>

</body>
</html>
