<style>
.survival-board-container { font-family: system-ui, -apple-system, sans-serif; background: rgba(20, 25, 35, 0.65) !important; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 14px; margin: 12px auto; max-width: 1000px; color: #f1f5f9; box-shadow: 0 12px 40px rgba(0,0,0,0.6); clear: both; box-sizing: border-box; width: 100%; }
.env-status-bar { display: flex; justify-content: space-around; flex-wrap: wrap; gap: 12px; background: rgba(0, 0, 0, 0.4); border-radius: 10px; padding: 8px 16px; margin-bottom: 14px; border: 1px solid rgba(255,255,255,0.03); }
.env-item { display: flex; align-items: center; gap: 6px; font-size: 13px; }
.env-label { color: #94a3b8; }
.env-val { color: #38bdf8; font-weight: bold; }
.cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 14px; width: 100%; }
.char-card { background: rgba(30, 41, 59, 0.45); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 12px; padding: 12px 14px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.05); display: block !important; box-sizing: border-box; }
.user-card { background: rgba(14, 116, 144, 0.12); border-color: rgba(6, 182, 212, 0.2); }
.char-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.06); padding-bottom: 8px; margin-bottom: 10px; }
.char-name { font-size: 16px; font-weight: 700; color: #ffffff; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
.char-identity { font-size: 11px; font-weight: 600; padding: 2px 8px; background: rgba(6, 182, 212, 0.2); border-radius: 6px; color: #22d3ee; }
.stats-grid { display: flex; flex-direction: column; gap: 6px; width: 100%; }
.stat-item { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; height: 22px; width: 100%; box-sizing: border-box; }
.stat-label { width: 65px; min-width: 65px; color: #cbd5e1; font-weight: 500; text-align: left; }
.progress-bar { flex-grow: 1; height: 7px; background: rgba(0,0,0,0.5); border-radius: 4px; margin: 0 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.02); position: relative; }
.progress-fill { height: 100%; width: 0%; border-radius: 4px; transition: width 0.3s ease-out; }

.bar-energy { background: linear-gradient(90deg, #e11d48, #fb7185); }
.bar-food { background: linear-gradient(90deg, #ea580c, #f97316); }
.bar-water { background: linear-gradient(90deg, #0284c7, #38bdf8); }
.bar-health { background: linear-gradient(90deg, #16a34a, #4ade80); }
.bar-stress { background: linear-gradient(90deg, #7c3aed, #a78bfa); }
.bar-cloth { background: linear-gradient(90deg, #475569, #94a3b8); }
.bar-burn { background: linear-gradient(90deg, #b91c1c, #f87171); }

.stat-value { width: 28px; min-width: 28px; text-align: right; font-family: ui-monospace, monospace; font-weight: 600; color: #f1f5f9; }
.stat-badge { padding: 2px 8px; border-radius: 6px; font-size: 11.5px; background: rgba(255,255,255,0.08); color: #e2e8f0; border: 1px solid rgba(255,255,255,0.05); font-weight: 500; max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; }
</style>

<script>
(function() {
// 修复1：同时支持斜杠路径和点号路径
function getIslandVariable(vars, keyPath) {
if (!vars) return undefined;
if (vars[keyPath] !== undefined) return vars[keyPath];

// 把 "世界/当前日期" 转成 "世界.当前日期" 再查一次
var dotPath = keyPath.replace(/\//g, '.');
if (dotPath !== keyPath && vars[dotPath] !== undefined) return vars[dotPath];

var chunks = keyPath.split('/');
if (chunks.length === 2 && vars[chunks[0]]) {
return vars[chunks[0]][chunks[1]];
}
return undefined;
}

function fixUserRealName() {
try {
var myName = window.SillyTavern?.context?.user_name || window.user_name || "";
if (!myName || myName === "{{user}}") {
myName = document.getElementById('name_text')?.value || jQuery("#user_name").val() || jQuery(".user_name_text").text() || "主角";
}
jQuery("#mvu-player-name").text(myName);
} catch(e) {}
}

function syncIslandBoard() {
fixUserRealName();

// 修复2：优先读 init 写入的 window.Mvu.variables，再 fallback
var pool = window.Mvu?.variables ||
(typeof getAllVariables === 'function' ? getAllVariables() : null) ||
window.SillyTavern?.variables ||
window.Tavern?.variables ||
{};

jQuery("#mvu-world-date").text(getIslandVariable(pool, "世界/当前日期") || "第1天");
jQuery("#mvu-world-time").text(getIslandVariable(pool, "世界/时间") || "正午");
jQuery("#mvu-world-weather").text(getIslandVariable(pool, "世界/天气") || "晴朗烈日");

var groups = ['主角', '苏澜', '周宁'];
var idKeys = { '主角': 'user', '苏澜': 'sulan', '周宁': 'zhouning' };
var fields = ['体能', '饱食度', '水分', '健康', '内心紧绷度', '衣物破损度', '晒伤程度'];

groups.forEach(function(g) {
var k = idKeys[g];

fields.forEach(function(f) {
var rawVal = getIslandVariable(pool, g + "/" + f);
if (rawVal !== undefined && rawVal !== null && rawVal !== '') {
var num = parseInt(rawVal, 10);
if (!isNaN(num)) {
jQuery("#bar-" + k + "-" + f).css("width", num + "%");
jQuery("#val-" + k + "-" + f).text(num);
}
}
});

var emo = getIslandVariable(pool, g + "/情绪状态");
if (emo !== undefined && emo !== null && emo !== '') {
jQuery("#badge-" + k + "-情绪状态").text(emo);
}
});
}

document.addEventListener('VARIABLE_UPDATE_ENDED', syncIslandBoard);
setInterval(syncIslandBoard, 500);
syncIslandBoard();
})();
</script>
